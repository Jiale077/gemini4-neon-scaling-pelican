<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>海岸至都市 · 3D 鹈鹕骑行一镜到底</title>
  <style>
    :root {
      --glass-bg: rgba(14, 20, 28, 0.52);
      --glass-border: rgba(255, 255, 255, 0.16);
      --accent: #f3b35c;
      --accent-soft: rgba(243, 179, 92, 0.22);
      --text-main: #f6f8fa;
      --text-muted: rgba(240, 245, 250, 0.72);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d1620;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text-main);
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    /* Subtle cinematic vignette & optional letterbox */
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, transparent 56%, rgba(8, 12, 18, 0.38) 100%);
      z-index: 2;
    }

    .letterbox-top, .letterbox-bottom {
      position: fixed;
      left: 0;
      right: 0;
      height: 0;
      background: #05070a;
      pointer-events: none;
      z-index: 3;
      transition: height 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .letterbox-top { top: 0; }
    .letterbox-bottom { bottom: 0; }

    body.cinema-bars .letterbox-top,
    body.cinema-bars .letterbox-bottom {
      height: 5.5vh;
    }

    /* Smooth golden transition veil for seamless loop */
    #loop-veil {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 42%, rgba(255, 224, 174, 0.96), rgba(242, 176, 108, 0.92));
      opacity: 0;
      z-index: 4;
      transition: opacity 0.25s linear;
    }

    /* Loading overlay */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: radial-gradient(circle at 50% 35%, #1d364a 0%, #0d1620 75%);
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-ring {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 2.5px solid rgba(255, 255, 255, 0.14);
      border-top-color: var(--accent);
      animation: spin 0.95s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader-title {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--text-main);
    }

    .loader-sub {
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    /* Top HUD badge */
    .hud-top {
      position: fixed;
      top: 20px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    body.cinema-bars .hud-top {
      top: calc(5.5vh + 14px);
    }

    body.hud-hidden .hud-top,
    body.hud-hidden .hud-bottom {
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
    }

    .title-card {
      pointer-events: auto;
      padding: 11px 16px;
      border-radius: 14px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
    }

    .title-card h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      display: inline-block;
    }

    .zone-label {
      margin-top: 4px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .zone-pill {
      color: var(--accent);
      font-weight: 500;
    }

    .top-actions {
      pointer-events: auto;
      display: flex;
      gap: 8px;
    }

    .chip-btn {
      appearance: none;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 500;
      padding: 8px 13px;
      border-radius: 12px;
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .chip-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.32);
    }

    .chip-btn:active {
      transform: scale(0.97);
    }

    .chip-btn.active {
      background: var(--accent-soft);
      border-color: rgba(243, 179, 92, 0.65);
      color: #ffe2b3;
    }

    /* Bottom transport HUD */
    .hud-bottom {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      width: min(720px, calc(100vw - 32px));
      padding: 12px 18px 14px;
      border-radius: 18px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.28);
      z-index: 10;
      transition: opacity 0.4s ease, transform 0.4s ease, bottom 0.5s ease;
    }

    body.cinema-bars .hud-bottom {
      bottom: calc(5.5vh + 14px);
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .controls-left, .controls-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .telemetry {
      font-size: 11.5px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    .timeline-wrap {
      position: relative;
      padding: 6px 0 18px;
    }

    #progress-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      outline: none;
      cursor: pointer;
    }

    #progress-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #fff;
      box-shadow: 0 0 12px rgba(243, 179, 92, 0.75);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    #progress-slider::-webkit-slider-thumb:hover {
      transform: scale(1.18);
    }

    .zone-markers {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .zone-markers span {
      transition: color 0.3s ease;
    }

    .zone-markers span.current {
      color: var(--accent);
      font-weight: 600;
    }

    .hint-pill {
      position: fixed;
      bottom: 12px;
      right: 16px;
      z-index: 11;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.55);
      pointer-events: none;
    }

    body.cinema-bars .hint-pill {
      bottom: calc(5.5vh + 6px);
    }

    #error-banner {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 460px;
      padding: 20px 24px;
      border-radius: 16px;
      background: rgba(30, 14, 16, 0.92);
      border: 1px solid rgba(255, 110, 110, 0.45);
      color: #ffdada;
      font-size: 13px;
      line-height: 1.6;
      z-index: 30;
      display: none;
    }
    body.embed-mode .hud-top,
    body.embed-mode .hud-bottom,
    body.embed-mode .hint-pill,
    body.embed-mode .letterbox-top,
    body.embed-mode .letterbox-bottom,
    body.embed-mode .vignette,
    body.embed-mode #loader,
    body.embed-mode #loop-veil {
      display: none !important;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="cinema-bars">
  <div id="canvas-container"></div>
  <div class="vignette"></div>
  <div class="letterbox-top"></div>
  <div class="letterbox-bottom"></div>
  <div id="loop-veil"></div>

  <div id="loader">
    <div class="loader-ring"></div>
    <div class="loader-title">正在生成写实材质与海滨都市世界</div>
    <div class="loader-sub">PBR 羽毛 · 海浪着色器 · 木栈道 · 都市天际线 · 连续一镜到底</div>
  </div>

  <div id="error-banner"></div>

  <div class="hud-top">
    <div class="title-card">
      <h1><span class="live-dot"></span>鹈鹕单车穿越记 · 一镜到底</h1>
      <div class="zone-label">
        <span>当前路段</span>
        <span class="zone-pill" id="zone-name">黄金沙滩海岸 · Golden Beach</span>
      </div>
    </div>
    <div class="top-actions">
      <button class="chip-btn active" id="btn-cinema" title="切换连续电影运镜与自由环绕视角">🎬 连续运镜</button>
      <button class="chip-btn active" id="btn-bars" title="开关电影宽银幕遮幅">宽银幕</button>
      <button class="chip-btn" id="btn-hud" title="按 H 键隐藏/显示界面">隐藏界面 (H)</button>
    </div>
  </div>

  <div class="hud-bottom">
    <div class="controls-row">
      <div class="controls-left">
        <button class="chip-btn" id="btn-play">⏸ 暂停</button>
        <button class="chip-btn" id="btn-speed">1.0× 巡航</button>
        <button class="chip-btn" id="btn-restart">↺ 从海滩出发</button>
      </div>
      <div class="controls-right">
        <span class="telemetry" id="telemetry-text">0 m / 720 m · 26 km/h</span>
      </div>
    </div>
    <div class="timeline-wrap">
      <input type="range" id="progress-slider" min="0" max="1000" value="0" step="1" />
      <div class="zone-markers">
        <span id="zm-0" class="current">01 黄金海滩</span>
        <span id="zm-1">02 海滨木栈道</span>
        <span id="zm-2">03 滨海大道</span>
        <span id="zm-3">04 黄金时刻都市</span>
      </div>
    </div>
  </div>

  <div class="hint-pill">拖拽画面可自由观察材质 · 按 Space 暂停 · 按 C 恢复连续运镜 · 按 H 开关 HUD</div>

  <script type="module">
    import * as THREE from 'three';

    // =========================================================================
    // 0. MATH & DETERMINISTIC RANDOM UTILITIES
    // =========================================================================
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const smoothstep = (e0, e1, x) => {
      const t = clamp((x - e0) / (e1 - e0), 0, 1);
      return t * t * (3 - 2 * t);
    };
    const smootherstep = (e0, e1, x) => {
      const t = clamp((x - e0) / (e1 - e0), 0, 1);
      return t * t * t * (t * (t * 6 - 15) + 10);
    };

    function mulberry32(seed) {
      let a = seed >>> 0;
      return function () {
        a |= 0;
        a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function hash2(x, y) {
      const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
      return s - Math.floor(s);
    }

    function valueNoise2D(x, y) {
      const ix = Math.floor(x);
      const iy = Math.floor(y);
      const fx = x - ix;
      const fy = y - iy;
      const ux = fx * fx * (3 - 2 * fx);
      const uy = fy * fy * (3 - 2 * fy);
      const a = hash2(ix, iy);
      const b = hash2(ix + 1, iy);
      const c = hash2(ix, iy + 1);
      const d = hash2(ix + 1, iy + 1);
      return lerp(lerp(a, b, ux), lerp(c, d, ux), uy);
    }

    function fbm2D(x, y, octaves = 4) {
      let value = 0;
      let amp = 0.5;
      let freq = 1;
      for (let i = 0; i < octaves; i++) {
        value += amp * valueNoise2D(x * freq, y * freq);
        freq *= 2.03;
        amp *= 0.5;
      }
      return value;
    }

    // =========================================================================
    // 1. CONTINUOUS WORLD PATH & BIOME COORDINATE FUNCTIONS
    // =========================================================================
    const TOTAL_LENGTH = 720; // meters along -Z

    // Road center X as function of normalized u in [0, 1]
    function pathX(u) {
      const straight = 1 - smoothstep(0.74, 0.90, u) * 0.82;
      const wave1 = 22.0 * Math.sin(u * Math.PI * 2.15 + 0.15);
      const wave2 = -9.5 * Math.sin(u * Math.PI * 4.35 - 0.35);
      return (wave1 + wave2) * straight;
    }

    // Road surface elevation Y as function of u
    function pathY(u) {
      const beachBase = 0.44 + 0.05 * Math.sin(u * 48.0) * (1 - smoothstep(0.22, 0.27, u));
      const toBoardwalk = smootherstep(0.245, 0.295, u);
      const toBoulevard = smootherstep(0.49, 0.56, u);
      return beachBase + toBoardwalk * 1.12 + toBoulevard * 0.84;
    }

    function pathZ(u) {
      return -u * TOTAL_LENGTH;
    }

    function getPathFrame(u) {
      const eps = 0.0005;
      const u0 = clamp(u - eps, 0, 1);
      const u1 = clamp(u + eps, 0, 1);
      const p = new THREE.Vector3(pathX(u), pathY(u), pathZ(u));
      const p0 = new THREE.Vector3(pathX(u0), pathY(u0), pathZ(u0));
      const p1 = new THREE.Vector3(pathX(u1), pathY(u1), pathZ(u1));
      const forward = p1.clone().sub(p0).normalize();
      const up = new THREE.Vector3(0, 1, 0);
      // Right vector when facing forward (-Z): right is +X, left (ocean) is -X
      const right = new THREE.Vector3().crossVectors(forward, up).normalize();

      // Approximate horizontal curvature for natural bicycle lean & steering
      const um = clamp(u - 0.008, 0, 1);
      const up2 = clamp(u + 0.008, 0, 1);
      const dx1 = pathX(u) - pathX(um);
      const dx2 = pathX(up2) - pathX(u);
      const curvature = clamp((dx2 - dx1) * 14.0, -0.45, 0.45);

      return { position: p, forward, right, up, curvature };
    }

    // Continuous terrain height for any (u, lateral) where lateral < 0 is OCEAN/LEFT, lateral > 0 is INLAND/RIGHT
    function getGroundHeightAt(u, lat) {
      const py = pathY(u);
      const beachFactor = 1 - smoothstep(0.47, 0.57, u);
      const urbanFactor = smoothstep(0.50, 0.62, u);
      const cityLeftFactor = smoothstep(0.64, 0.74, u);

      // Beach & coastal profile
      let coastY = py;
      if (lat < 0) {
        // Sloping toward ocean
        const dist = -lat;
        const slope = smoothstep(2.2, 16.0, dist) * (py + 1.35) + smoothstep(16.0, 55.0, dist) * 2.2;
        const ripple = 0.08 * Math.sin(u * 90 + lat * 0.4);
        coastY = py - slope + ripple * smoothstep(2, 10, dist);
      } else {
        // Gently rising sand dunes inland
        const dist = lat;
        const duneBase = smoothstep(3.2, 26.0, dist) * 3.8;
        const duneUndul =
          (fbm2D(u * 26.0, dist * 0.09, 3) - 0.42) * 3.2 * smoothstep(4.5, 18.0, dist);
        coastY = py + duneBase + duneUndul;
      }

      // Under boardwalk (u in 0.25..0.51), drop sand slightly underneath the elevated deck
      const underDeck = smoothstep(0.25, 0.30, u) * (1 - smoothstep(0.49, 0.53, u));
      if (underDeck > 0.001) {
        const deckDrop = (1 - smoothstep(2.6, 8.5, Math.abs(lat))) * 1.15 * underDeck;
        coastY -= deckDrop;
      }

      // Urban ground profile (boulevard + sidewalks + city blocks)
      let urbanY = py - 0.02;
      if (lat < -5.2 && cityLeftFactor < 0.99) {
        // Coastal seawall drop into ocean on left of boulevard before full city
        const seawallDrop = smoothstep(5.4, 7.6, -lat) * (py + 1.45);
        const seawallY = py - seawallDrop;
        urbanY = lerp(seawallY, py + 0.16, cityLeftFactor);
      } else if (Math.abs(lat) > 5.2) {
        urbanY = py + 0.16; // Sidewalk & city block grade
      }

      return lerp(coastY, urbanY, urbanFactor);
    }

    function getWorldGroundY(x, z) {
      const u = clamp(-z / TOTAL_LENGTH, 0, 1);
      const lat = x - pathX(u);
      const groundY = getGroundHeightAt(u, lat);
      // Include elevated boardwalk deck height when over deck
      if (u >= 0.245 && u <= 0.515 && Math.abs(lat) < 3.4) {
        return Math.max(groundY, pathY(u));
      }
      return groundY;
    }

    // =========================================================================
    // 2. PROCEDURAL REAL-WORLD PBR TEXTURE SUITE
    // =========================================================================
    function makeCanvas(w, h) {
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      return c;
    }

    function setupTex(canvas, isColor = true, rx = 1, ry = 1, maxAniso = 8) {
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(rx, ry);
      tex.anisotropy = maxAniso;
      if (isColor) tex.colorSpace = THREE.SRGBColorSpace;
      tex.needsUpdate = true;
      return tex;
    }

    function createFeatherTextures(maxAniso, dark = false) {
      const w = 512, h = 512;
      const cMap = makeCanvas(w, h);
      const cBump = makeCanvas(w, h);
      const ctx = cMap.getContext('2d');
      const btx = cBump.getContext('2d');

      ctx.fillStyle = dark ? '#2a3038' : '#f4efe6';
      ctx.fillRect(0, 0, w, h);
      btx.fillStyle = '#808080';
      btx.fillRect(0, 0, w, h);

      const rand = mulberry32(dark ? 911 : 404);
      const rows = 14;
      const cols = 10;
      const fw = w / cols;
      const fh = h / rows;

      for (let r = -1; r <= rows; r++) {
        for (let c = -1; c <= cols; c++) {
          const ox = (r % 2 === 0 ? 0 : fw * 0.5) + c * fw + (rand() - 0.5) * 4;
          const oy = r * fh + (rand() - 0.5) * 3;
          const radX = fw * 0.62;
          const radY = fh * 0.98;

          // Albedo layered feather
          const grad = ctx.createRadialGradient(ox, oy - radY * 0.2, 2, ox, oy, radY);
          if (dark) {
            const v = Math.floor(38 + rand() * 18);
            grad.addColorStop(0, `rgb(${v + 18}, ${v + 22}, ${v + 28})`);
            grad.addColorStop(0.75, `rgb(${v}, ${v + 3}, ${v + 8})`);
            grad.addColorStop(1, `rgb(${v + 26}, ${v + 28}, ${v + 32})`);
          } else {
            const warm = Math.floor(rand() * 12);
            grad.addColorStop(0, `rgb(${252 - warm}, ${248 - warm}, ${240 - warm})`);
            grad.addColorStop(0.78, `rgb(${238 - warm}, ${231 - warm}, ${218 - warm})`);
            grad.addColorStop(1, `rgb(${214 - warm}, ${205 - warm}, ${190 - warm})`);
          }
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.ellipse(ox, oy, radX, radY, 0, 0, Math.PI * 2);
          ctx.fill();

          // Fine feather barb lines
          ctx.strokeStyle = dark ? 'rgba(200,210,220,0.08)' : 'rgba(155,140,120,0.16)';
          ctx.lineWidth = 1;
          for (let b = -4; b <= 4; b++) {
            ctx.beginPath();
            ctx.moveTo(ox, oy - radY * 0.55);
            ctx.quadraticCurveTo(ox + b * 4.5, oy, ox + b * 6.5, oy + radY * 0.72);
            ctx.stroke();
          }

          // Bump relief
          const bGrad = btx.createRadialGradient(ox, oy - radY * 0.15, 2, ox, oy, radY);
          bGrad.addColorStop(0, '#dadada');
          bGrad.addColorStop(0.78, '#909090');
          bGrad.addColorStop(1, '#3c3c3c');
          btx.fillStyle = bGrad;
          btx.beginPath();
          btx.ellipse(ox, oy, radX, radY, 0, 0, Math.PI * 2);
          btx.fill();
        }
      }

      return {
        map: setupTex(cMap, true, 2, 2, maxAniso),
        bumpMap: setupTex(cBump, false, 2, 2, maxAniso),
      };
    }

    function createSandTextures(maxAniso) {
      const w = 512, h = 512;
      const cMap = makeCanvas(w, h);
      const cBump = makeCanvas(w, h);
      const ctx = cMap.getContext('2d');
      const btx = cBump.getContext('2d');
      const img = ctx.createImageData(w, h);
      const bimg = btx.createImageData(w, h);

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const nx = x / w;
          const ny = y / h;
          const ripple = Math.sin((ny * 18 + fbm2D(nx * 5, ny * 5, 3) * 1.4) * Math.PI * 2) * 0.5 + 0.5;
          const grain = hash2(x * 1.13, y * 1.37);
          const fine = fbm2D(nx * 14, ny * 14, 3);
          const shade = 0.84 + ripple * 0.09 + (grain - 0.5) * 0.11 + (fine - 0.5) * 0.08;
          const sparkle = grain > 0.985 ? 28 : 0;

          const idx = (y * w + x) * 4;
          img.data[idx] = clamp(232 * shade + sparkle, 0, 255);
          img.data[idx + 1] = clamp(206 * shade + sparkle * 0.9, 0, 255);
          img.data[idx + 2] = clamp(164 * shade + sparkle * 0.7, 0, 255);
          img.data[idx + 3] = 255;

          const bv = clamp(110 + ripple * 70 + (grain - 0.5) * 75, 0, 255);
          bimg.data[idx] = bimg.data[idx + 1] = bimg.data[idx + 2] = bv;
          bimg.data[idx + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      btx.putImageData(bimg, 0, 0);

      return {
        map: setupTex(cMap, true, 16, 48, maxAniso),
        bumpMap: setupTex(cBump, false, 16, 48, maxAniso),
      };
    }

    function createBoardwalkTextures(maxAniso) {
      const w = 512, h = 512;
      const cMap = makeCanvas(w, h);
      const cBump = makeCanvas(w, h);
      const cRough = makeCanvas(w, h);
      const ctx = cMap.getContext('2d');
      const btx = cBump.getContext('2d');
      const rtx = cRough.getContext('2d');

      const rand = mulberry32(773);
      const plankCount = 8;
      const ph = h / plankCount;

      for (let i = 0; i < plankCount; i++) {
        const y0 = i * ph;
        const tone = 0.86 + rand() * 0.24;
        const bleach = rand() * 20;
        const r = Math.floor(clamp(164 * tone + bleach, 92, 220));
        const g = Math.floor(clamp(124 * tone + bleach, 74, 188));
        const b = Math.floor(clamp(88 * tone + bleach * 0.9, 54, 155));

        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(0, y0, w, ph);

        const rv = Math.floor(172 + rand() * 44);
        rtx.fillStyle = `rgb(${rv},${rv},${rv})`;
        rtx.fillRect(0, y0, w, ph);

        btx.fillStyle = '#c8c8c8';
        btx.fillRect(0, y0, w, ph);

        // Wood grain streaks running across the plank
        for (let s = 0; s < 38; s++) {
          const sy = y0 + 3 + rand() * (ph - 6);
          const alpha = 0.07 + rand() * 0.13;
          ctx.strokeStyle = rand() > 0.35 ? `rgba(62,40,22,${alpha})` : `rgba(228,210,185,${alpha * 0.65})`;
          ctx.lineWidth = 1.0 + rand() * 2.0;
          ctx.beginPath();
          ctx.moveTo(0, sy);
          ctx.bezierCurveTo(w * 0.33, sy + (rand() - 0.5) * 5, w * 0.66, sy + (rand() - 0.5) * 5, w, sy);
          ctx.stroke();

          btx.strokeStyle = `rgba(92,92,92,${alpha * 1.2})`;
          btx.lineWidth = 1;
          btx.beginPath();
          btx.moveTo(0, sy);
          btx.lineTo(w, sy);
          btx.stroke();
        }

        // Crisp dark cedar plank gap seam (softened to eliminate distance moire)
        ctx.fillStyle = 'rgba(42, 28, 18, 0.85)';
        ctx.fillRect(0, y0, w, 2.5);
        btx.fillStyle = '#262626';
        btx.fillRect(0, y0, w, 3);
        rtx.fillStyle = '#efefef';
        rtx.fillRect(0, y0, w, 3);
      }

      return {
        map: setupTex(cMap, true, 1, 24, maxAniso),
        bumpMap: setupTex(cBump, false, 1, 24, maxAniso),
        roughnessMap: setupTex(cRough, false, 1, 24, maxAniso),
      };
    }

    function createAsphaltTextures(maxAniso) {
      const w = 512, h = 512;
      const cMap = makeCanvas(w, h);
      const cBump = makeCanvas(w, h);
      const cRough = makeCanvas(w, h);
      const ctx = cMap.getContext('2d');
      const btx = cBump.getContext('2d');
      const rtx = cRough.getContext('2d');

      const img = ctx.createImageData(w, h);
      const bimg = btx.createImageData(w, h);
      const rimg = rtx.createImageData(w, h);

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const u = x / w;
          const v = y / h;
          const agg = hash2(x * 1.7, y * 1.9);
          const patch = fbm2D(u * 8, v * 8, 3);
          // Subtle tire-wear tracks (slightly smoother sheen catching golden sunlight)
          const tireWear =
            Math.exp(-Math.pow((u - 0.24) / 0.08, 2)) +
            Math.exp(-Math.pow((u - 0.50) / 0.08, 2)) +
            Math.exp(-Math.pow((u - 0.78) / 0.08, 2));

          const base = 96 + (agg - 0.5) * 32 + (patch - 0.5) * 22 - tireWear * 10;
          const idx = (y * w + x) * 4;
          img.data[idx] = clamp(base, 54, 155);
          img.data[idx + 1] = clamp(base + 2, 56, 158);
          img.data[idx + 2] = clamp(base + 6, 60, 164);
          img.data[idx + 3] = 255;

          const bv = clamp(128 + (agg - 0.5) * 115 + (patch - 0.5) * 35, 0, 255);
          bimg.data[idx] = bimg.data[idx + 1] = bimg.data[idx + 2] = bv;
          bimg.data[idx + 3] = 255;

          const rv = clamp(192 - tireWear * 54 + (agg - 0.5) * 28, 86, 236);
          rimg.data[idx] = rimg.data[idx + 1] = rimg.data[idx + 2] = rv;
          rimg.data[idx + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      btx.putImageData(bimg, 0, 0);
      rtx.putImageData(rimg, 0, 0);

      // Subtle painted road markings (double yellow center left-of-pelican, crisp white edges & dashed lane)
      // Pelican rides near road center-right, so put crisp white shoulder lines & center dashed markings
      ctx.fillStyle = 'rgba(236, 232, 222, 0.82)';
      ctx.fillRect(w * 0.055, 0, 7, h); // Left curb stripe
      ctx.fillRect(w * 0.93, 0, 7, h);  // Right curb stripe

      // Dashed white bike-lane / center divider
      ctx.fillStyle = 'rgba(242, 238, 226, 0.78)';
      ctx.fillRect(w * 0.64, h * 0.08, 6, h * 0.36);
      ctx.fillRect(w * 0.64, h * 0.58, 6, h * 0.36);

      // Warm faded double amber centerline on the car lane side
      ctx.fillStyle = 'rgba(222, 168, 66, 0.80)';
      ctx.fillRect(w * 0.34, 0, 5, h);
      ctx.fillRect(w * 0.365, 0, 5, h);

      // Slightly wear out paint with tiny asphalt speckles
      const rand = mulberry32(2026);
      ctx.fillStyle = 'rgba(54, 56, 60, 0.45)';
      for (let i = 0; i < 650; i++) {
        ctx.fillRect(rand() * w, rand() * h, 2 + rand() * 3, 2 + rand() * 2);
      }

      return {
        map: setupTex(cMap, true, 1, 34, maxAniso),
        bumpMap: setupTex(cBump, false, 1, 34, maxAniso),
        roughnessMap: setupTex(cRough, false, 1, 34, maxAniso),
      };
    }

    function createConcreteTextures(maxAniso) {
      const w = 512, h = 512;
      const cMap = makeCanvas(w, h);
      const cBump = makeCanvas(w, h);
      const ctx = cMap.getContext('2d');
      const btx = cBump.getContext('2d');

      const img = ctx.createImageData(w, h);
      const bimg = btx.createImageData(w, h);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const n = fbm2D((x / w) * 10, (y / h) * 10, 3);
          const g = hash2(x, y);
          const base = 176 + (n - 0.5) * 28 + (g - 0.5) * 16;
          const idx = (y * w + x) * 4;
          img.data[idx] = clamp(base + 4, 0, 255);
          img.data[idx + 1] = clamp(base + 1, 0, 255);
          img.data[idx + 2] = clamp(base - 4, 0, 255);
          img.data[idx + 3] = 255;
          const bv = clamp(128 + (g - 0.5) * 60 + (n - 0.5) * 40, 0, 255);
          bimg.data[idx] = bimg.data[idx + 1] = bimg.data[idx + 2] = bv;
          bimg.data[idx + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      btx.putImageData(bimg, 0, 0);

      // Poured slab expansion joints
      ctx.strokeStyle = 'rgba(80, 76, 70, 0.55)';
      ctx.lineWidth = 3;
      btx.strokeStyle = '#303030';
      btx.lineWidth = 4;
      for (let i = 0; i < 4; i++) {
        const y = i * (h / 4);
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
        btx.beginPath(); btx.moveTo(0, y); btx.lineTo(w, y); btx.stroke();
      }
      ctx.beginPath(); ctx.moveTo(w * 0.5, 0); ctx.lineTo(w * 0.5, h); ctx.stroke();
      btx.beginPath(); btx.moveTo(w * 0.5, 0); btx.lineTo(w * 0.5, h); btx.stroke();

      return {
        map: setupTex(cMap, true, 1, 36, maxAniso),
        bumpMap: setupTex(cBump, false, 1, 36, maxAniso),
      };
    }

    function createBuildingFacade(style, maxAniso, seed) {
      const w = 512, h = 512;
      const cMap = makeCanvas(w, h);
      const cRough = makeCanvas(w, h);
      const cBump = makeCanvas(w, h);
      const cEmissive = makeCanvas(w, h);
      const ctx = cMap.getContext('2d');
      const rtx = cRough.getContext('2d');
      const btx = cBump.getContext('2d');
      const etx = cEmissive.getContext('2d');
      const rand = mulberry32(seed);

      etx.fillStyle = '#000000';
      etx.fillRect(0, 0, w, h);

      if (style === 'glass') {
        // Modern reflective architectural glass tower (bright steel-blue curtain wall)
        ctx.fillStyle = '#4e6c82';
        ctx.fillRect(0, 0, w, h);
        rtx.fillStyle = '#242424'; // Glossy architectural glass
        rtx.fillRect(0, 0, w, h);
        btx.fillStyle = '#707070';
        btx.fillRect(0, 0, w, h);

        const cols = 8, rows = 10;
        const cw = w / cols, rh = h / rows;

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const x = c * cw, y = r * rh;
            const lit = rand() < 0.36;
            const shade = rand();
            const g = ctx.createLinearGradient(x, y, x, y + rh);
            if (lit) {
              g.addColorStop(0, '#788f9e');
              g.addColorStop(0.55, '#ad9678');
              g.addColorStop(1, '#5e7080');
              const warmth = rand() > 0.32
                ? `rgba(255, ${Math.floor(195 + rand() * 35)}, ${Math.floor(125 + rand() * 35)}, ${0.42 + rand() * 0.40})`
                : `rgba(210, 232, 255, ${0.30 + rand() * 0.25})`;
              etx.fillStyle = warmth;
              etx.fillRect(x + 4, y + 6, cw - 8, rh - 14);
            } else {
              const bVal = Math.floor(88 + shade * 38);
              g.addColorStop(0, `rgb(${bVal - 10}, ${bVal + 14}, ${bVal + 34})`);
              g.addColorStop(1, `rgb(${bVal - 22}, ${bVal}, ${bVal + 18})`);
            }
            ctx.fillStyle = g;
            ctx.fillRect(x + 3, y + 4, cw - 6, rh - 10);

            // Spandrel floor slab band (brushed architectural aluminum)
            ctx.fillStyle = '#445564';
            ctx.fillRect(x, y + rh - 9, cw, 9);
            rtx.fillStyle = '#686868';
            rtx.fillRect(x, y + rh - 9, cw, 9);

            // Brushed aluminum mullions
            ctx.fillStyle = '#a4b2be';
            ctx.fillRect(x, y, 3, rh);
            ctx.fillRect(x, y, cw, 2.5);
            btx.fillStyle = '#ebebeb';
            btx.fillRect(x, y, 3.5, rh);
            btx.fillRect(x, y, cw, 3);
            rtx.fillStyle = '#525252';
            rtx.fillRect(x, y, 3, rh);
          }
        }
      } else {
        // Warm Limestone or Heritage Urban Brick
        const isBrick = style === 'brick';
        ctx.fillStyle = isBrick ? '#9d5942' : '#d8ccb8';
        ctx.fillRect(0, 0, w, h);
        rtx.fillStyle = isBrick ? '#dcdcdc' : '#d2d2d2';
        rtx.fillRect(0, 0, w, h);
        btx.fillStyle = '#b8b8b8';
        btx.fillRect(0, 0, w, h);

        // Masonry texture courses
        const courseH = isBrick ? 10 : 28;
        for (let y = 0; y < h; y += courseH) {
          const offset = (Math.floor(y / courseH) % 2) * (isBrick ? 14 : 32);
          for (let x = -32; x < w; x += (isBrick ? 28 : 64)) {
            const v = (rand() - 0.5) * 20;
            if (isBrick) {
              ctx.fillStyle = `rgb(${clamp(158 + v, 110, 195)}, ${clamp(86 + v * 0.7, 55, 120)}, ${clamp(64 + v * 0.5, 42, 96)})`;
            } else {
              ctx.fillStyle = `rgb(${clamp(216 + v * 0.6, 185, 238)}, ${clamp(204 + v * 0.6, 174, 226)}, ${clamp(184 + v * 0.6, 155, 208)})`;
            }
            ctx.fillRect(x + offset + 1, y + 1, (isBrick ? 26 : 62), courseH - 2);
          }
          btx.fillStyle = '#787878';
          btx.fillRect(0, y, w, 1.5);
        }

        const cols = 6, rows = 6;
        const cw = w / cols, rh = h / rows;
        for (let r = 0; r < rows; r++) {
          // Horizontal stone cornice band
          ctx.fillStyle = isBrick ? '#cbbca6' : '#e6dccb';
          ctx.fillRect(0, r * rh, w, 6);
          btx.fillStyle = '#f2f2f2';
          btx.fillRect(0, r * rh, w, 6);

          for (let c = 0; c < cols; c++) {
            const wx = c * cw + 14;
            const wy = r * rh + 16;
            const ww = cw - 28;
            const wh = rh - 26;

            // Stone window sill & lintel
            ctx.fillStyle = '#dfd4c2';
            ctx.fillRect(wx - 4, wy - 5, ww + 8, 5);
            ctx.fillRect(wx - 4, wy + wh, ww + 8, 6);
            btx.fillStyle = '#f0f0f0';
            btx.fillRect(wx - 4, wy - 5, ww + 8, 5);
            btx.fillRect(wx - 4, wy + wh, ww + 8, 6);

            // Recessed glass pane
            const lit = rand() < 0.42;
            ctx.fillStyle = lit ? '#6e5c47' : '#263440';
            ctx.fillRect(wx, wy, ww, wh);
            rtx.fillStyle = '#242424';
            rtx.fillRect(wx, wy, ww, wh);
            btx.fillStyle = '#353535';
            btx.fillRect(wx, wy, ww, wh);

            if (lit) {
              etx.fillStyle = `rgba(255, ${Math.floor(198 + rand() * 34)}, ${Math.floor(118 + rand() * 38)}, ${0.52 + rand() * 0.36})`;
              etx.fillRect(wx + 2, wy + 2, ww - 4, wh - 4);
            }

            // Window mullions
            ctx.fillStyle = '#d9d3c9';
            ctx.fillRect(wx + ww * 0.5 - 1.5, wy, 3, wh);
            ctx.fillRect(wx, wy + wh * 0.48, ww, 3);
            etx.fillStyle = '#000000';
            etx.fillRect(wx + ww * 0.5 - 1.5, wy, 3, wh);
            etx.fillRect(wx, wy + wh * 0.48, ww, 3);
          }
        }
      }

      return {
        map: setupTex(cMap, true, 1, 1, maxAniso),
        roughnessMap: setupTex(cRough, false, 1, 1, maxAniso),
        bumpMap: setupTex(cBump, false, 1, 1, maxAniso),
        emissiveMap: setupTex(cEmissive, true, 1, 1, maxAniso),
      };
    }

    function createStorefrontTextures(maxAniso) {
      const w = 512, h = 256;
      const cMap = makeCanvas(w, h);
      const cRough = makeCanvas(w, h);
      const cEmissive = makeCanvas(w, h);
      const ctx = cMap.getContext('2d');
      const rtx = cRough.getContext('2d');
      const etx = cEmissive.getContext('2d');

      // Stone base & dark architectural fascia
      ctx.fillStyle = '#5c5852';
      ctx.fillRect(0, 0, w, h);
      rtx.fillStyle = '#c8c8c8';
      rtx.fillRect(0, 0, w, h);
      etx.fillStyle = '#000000';
      etx.fillRect(0, 0, w, h);

      // Upper dark bronze fascia sign band
      ctx.fillStyle = '#2b323a';
      ctx.fillRect(0, 0, w, 54);
      ctx.fillStyle = '#d4c3a4';
      ctx.fillRect(0, 50, w, 5);

      // Lower stone plinth
      ctx.fillStyle = '#736c63';
      ctx.fillRect(0, h - 34, w, 34);

      // 4 glazed retail storefront bays with stone pilasters between
      const bays = 4;
      const bw = w / bays;
      for (let i = 0; i < bays; i++) {
        const bx = i * bw + 14;
        const ww = bw - 28;
        const wy = 66;
        const wh = h - 108;

        // Dark metal storefront frame
        ctx.fillStyle = '#24292e';
        ctx.fillRect(bx - 4, wy - 4, ww + 8, wh + 8);

        // Warm interior café/boutique gradient behind glass
        const g = ctx.createLinearGradient(bx, wy, bx, wy + wh);
        g.addColorStop(0, '#5a4532');
        g.addColorStop(0.5, '#9e7c52');
        g.addColorStop(1, '#3d332a');
        ctx.fillStyle = g;
        ctx.fillRect(bx, wy, ww, wh);
        rtx.fillStyle = '#222222';
        rtx.fillRect(bx, wy, ww, wh);

        // Selective warm interior glow (not flat!)
        const eg = etx.createLinearGradient(bx, wy, bx, wy + wh);
        eg.addColorStop(0, 'rgba(255, 204, 130, 0.72)');
        eg.addColorStop(0.6, 'rgba(240, 170, 95, 0.48)');
        eg.addColorStop(1, 'rgba(90, 55, 28, 0.20)');
        etx.fillStyle = eg;
        etx.fillRect(bx + 3, wy + 3, ww - 6, wh - 6);

        // Subtle interior silhouettes (shelves/pendant lamps/door mullion)
        ctx.fillStyle = '#262b30';
        ctx.fillRect(bx + ww * 0.5 - 2, wy, 4, wh);
        etx.fillStyle = '#000000';
        etx.fillRect(bx + ww * 0.5 - 2, wy, 4, wh);

        // Subtle illuminated shop sign strip on fascia
        etx.fillStyle = i % 2 === 0 ? 'rgba(255, 214, 145, 0.55)' : 'rgba(180, 224, 255, 0.45)';
        etx.fillRect(bx + 18, 18, ww - 36, 16);
        ctx.fillStyle = i % 2 === 0 ? '#f0d8a8' : '#cce4f6';
        ctx.fillRect(bx + 18, 18, ww - 36, 16);
      }

      return {
        map: setupTex(cMap, true, 1, 1, maxAniso),
        roughnessMap: setupTex(cRough, false, 1, 1, maxAniso),
        emissiveMap: setupTex(cEmissive, true, 1, 1, maxAniso),

    function createFoliageTexture(maxAniso, baseHex) {
      const w = 256, h = 256;
      const cMap = makeCanvas(w, h);
      const cBump = makeCanvas(w, h);
      const ctx = cMap.getContext('2d');
      const btx = cBump.getContext('2d');

      for (let i = 0; i < 420; i++) {
        const x = rand() * w;
        const y = rand() * h;
        const rx = 5 + rand() * 10;
        const ry = 3 + rand() * 6;
        const rot = rand() * Math.PI * 2;
        const shade = 0.65 + rand() * 0.65;
        const r = clamp(Math.round(baseCol.r * 255 * shade), 20, 230);
        const g = clamp(Math.round(baseCol.g * 255 * shade), 35, 235);
        const b = clamp(Math.round(baseCol.b * 255 * shade), 18, 195);
        ctx.fillStyle = `rgba(${r},${g},${b},0.88)`;
        ctx.beginPath();
        ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2);
        ctx.fill();

        const bv = Math.floor(70 + shade * 125);
        btx.fillStyle = `rgb(${bv},${bv},${bv})`;

      return {

    function createLeatherTexture(maxAniso) {
      const w = 256, h = 256;
      const cMap = makeCanvas(w, h);
      const cBump = makeCanvas(w, h);
      const ctx = cMap.getContext('2d');
      const btx = cBump.getContext('2d');

      const bimg = btx.createImageData(w, h);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const p = fbm2D(x * 0.18, y * 0.18, 3);
          const grain = hash2(x * 0.7, y * 0.7);
          const shade = 0.85 + p * 0.22 + (grain - 0.5) * 0.08;
          const idx = (y * w + x) * 4;
          img.data[idx] = clamp(128 * shade, 0, 255);
          img.data[idx + 1] = clamp(72 * shade, 0, 255);
          img.data[idx + 2] = clamp(40 * shade, 0, 255);
          img.data[idx + 3] = 255;
          const bv = clamp(90 + p * 120, 0, 255);
          bimg.data[idx] = bimg.data[idx + 1] = bimg.data[idx + 2] = bv;
          bimg.data[idx + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      btx.putImageData(bimg, 0, 0);
      return {
        map: setupTex(cMap, true, 2, 2, maxAniso),
        bumpMap: setupTex(cBump, false, 2, 2, maxAniso),
      };
    }

    function createWickerTexture(maxAniso) {
      const w = 256, h = 256;
      const cMap = makeCanvas(w, h);
      const cBump = makeCanvas(w, h);
      const ctx = cMap.getContext('2d');
      const btx = cBump.getContext('2d');
      ctx.fillStyle = '#5c4125';
      ctx.fillRect(0, 0, w, h);
      btx.fillStyle = '#202020';
      btx.fillRect(0, 0, w, h);

      const step = 16;
      for (let y = 0; y < h; y += step) {
        for (let x = 0; x < w; x += step) {
          const even = ((x / step) + (y / step)) % 2 === 0;
          ctx.fillStyle = even ? '#c89b5d' : '#b28448';
          btx.fillStyle = even ? '#d8d8d8' : '#a8a8a8';
          if (even) {
            ctx.fillRect(x + 1, y + 2, step - 2, step - 4);
            btx.fillRect(x + 1, y + 2, step - 2, step - 4);
          } else {
            ctx.fillRect(x + 2, y + 1, step - 4, step - 2);
            btx.fillRect(x + 2, y + 1, step - 4, step - 2);
          }
        }
      }
      return {
        map: setupTex(cMap, true, 3, 2, maxAniso),
        bumpMap: setupTex(cBump, false, 3, 2, maxAniso),
      };
    }

    function createTireTreadTexture(maxAniso) {
      const w = 256, h = 256;
      const cBump = makeCanvas(w, h);
      const btx = cBump.getContext('2d');
      btx.fillStyle = '#555555';
      btx.fillRect(0, 0, w, h);
      btx.strokeStyle = '#e0e0e0';
      btx.lineWidth = 6;
      for (let y = -16; y < h + 16; y += 22) {
        btx.beginPath();
        btx.moveTo(0, y + 14);
        btx.lineTo(w * 0.5, y);
        btx.lineTo(w, y + 14);
        btx.stroke();
      }
      return setupTex(cBump, false, 1, 18, maxAniso);
    }

    function createBarkTexture(maxAniso) {
      const w = 256, h = 256;
      const cMap = makeCanvas(w, h);
      const cBump = makeCanvas(w, h);
      const ctx = cMap.getContext('2d');
      const btx = cBump.getContext('2d');
      const rand = mulberry32(314);
      ctx.fillStyle = '#8b7762';
      ctx.fillRect(0, 0, w, h);
      btx.fillStyle = '#909090';
      btx.fillRect(0, 0, w, h);
      for (let y = 0; y < h; y += 14) {
        const shade = 112 + Math.floor(rand() * 34);
        ctx.fillStyle = `rgb(${shade + 18}, ${shade + 4}, ${shade - 12})`;
        ctx.fillRect(0, y, w, 10);
        ctx.fillStyle = '#504235';
        ctx.fillRect(0, y + 10, w, 4);
        btx.fillStyle = '#d4d4d4';
        btx.fillRect(0, y, w, 9);
        btx.fillStyle = '#383838';
        btx.fillRect(0, y + 9, w, 5);
      }
      return {
        map: setupTex(cMap, true, 1, 5, maxAniso),
        bumpMap: setupTex(cBump, false, 1, 5, maxAniso),
      };
    }

    // =========================================================================
    // 3. REALISTIC SKY DOME + DYNAMIC PMREM ENVIRONMENT + OCEAN SHADER
    // =========================================================================
    function createSkyDome() {
      const skyGeo = new THREE.SphereGeometry(950, 48, 32);
      const skyMat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: {
          uSunDir: { value: new THREE.Vector3(-0.62, 0.45, -0.64).normalize() },
          uTopColor: { value: new THREE.Color('#2f78be') },
          uHorizonColor: { value: new THREE.Color('#cbe7f5') },
          uGroundColor: { value: new THREE.Color('#8eb0c4') },
          uSunColor: { value: new THREE.Color('#fff5dc') },
          uTime: { value: 0 },
          uCloudOpacity: { value: 0.48 },
        },
        vertexShader: `
          varying vec3 vWorldDir;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldDir = normalize(position);
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          uniform vec3 uSunDir;
          uniform vec3 uTopColor;
          uniform vec3 uHorizonColor;
          uniform vec3 uGroundColor;
          uniform vec3 uSunColor;
          uniform float uTime;
          uniform float uCloudOpacity;
          varying vec3 vWorldDir;

          float hash(vec2 p) {
            return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
          }

          float noise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(
              mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
              mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
              u.y
            );
          }

          float fbm(vec2 p) {
            float v = 0.0;
            float a = 0.5;
            for (int i = 0; i < 5; i++) {
              v += a * noise(p);
              p = p * 2.05 + vec2(1.7, 9.2);
              a *= 0.5;
            }
            return v;
          }

          void main() {
            vec3 dir = normalize(vWorldDir);
            float h = dir.y;
            vec3 sky = mix(uHorizonColor, uTopColor, pow(clamp(h, 0.0, 1.0), 0.56));
            if (h < 0.0) {
              sky = mix(uHorizonColor, uGroundColor, clamp(-h * 4.5, 0.0, 1.0));
            }

            // Atmospheric Mie scattering around sun
            float sunAmt = max(dot(dir, normalize(uSunDir)), 0.0);
            sky += uSunColor * pow(sunAmt, 7.0) * 0.42;
            sky += uSunColor * pow(sunAmt, 64.0) * 0.72;
            sky += vec3(1.0, 0.98, 0.92) * smoothstep(0.9985, 0.9996, sunAmt) * 2.2;

            // Soft realistic high-altitude coastal clouds
            if (h > 0.02) {
              vec2 cloudUV = dir.xz / (h + 0.16) * 1.15 + vec2(uTime * 0.0045, uTime * 0.002);
              float c1 = fbm(cloudUV * 1.5);
              float c2 = fbm(cloudUV * 3.1 - vec2(uTime * 0.003, 0.0));
              float cloud = smoothstep(0.46, 0.78, c1 * 0.7 + c2 * 0.3);
              float horizonFade = smoothstep(0.02, 0.20, h);
              vec3 cloudLit = mix(vec3(0.95, 0.97, 1.0), uSunColor * 1.08, pow(sunAmt, 2.2) * 0.85);
              vec3 cloudShadow = mix(uTopColor * 0.75 + vec3(0.28), uHorizonColor * 0.88, 0.55);
              vec3 cloudCol = mix(cloudShadow, cloudLit, clamp(0.45 + c2 * 0.55 + pow(sunAmt, 3.0) * 0.4, 0.0, 1.0));
              sky = mix(sky, cloudCol, cloud * horizonFade * uCloudOpacity);
            }

            gl_FragColor = vec4(sky, 1.0);
          }
        `,
      });
      const mesh = new THREE.Mesh(skyGeo, skyMat);
      mesh.renderOrder = -10;
      return mesh;
    }

    function createRealisticOcean() {
      // Wide ocean mesh hugging the left coastline from z = +120 to z = -560
      const segX = 110, segZ = 220;
      const geo = new THREE.PlaneGeometry(240, 680, segX, segZ);
      geo.rotateX(-Math.PI / 2);

      // Shift X relative to coastline curve so shoreline detail is concentrated cleanly
      const pos = geo.attributes.position;
      const shoreDistAttr = new Float32Array(pos.count);
      for (let i = 0; i < pos.count; i++) {
        const lx = pos.getX(i); // -120..+120
        const lz = pos.getZ(i); // -340..+340
        const worldZ = lz - 210; // spans +130 to -550
        const u = clamp(-worldZ / TOTAL_LENGTH, 0, 1);
        const cx = pathX(u);
        // Place ocean from cx + 4m inward (hidden under sand) to cx - 236m offshore
        const worldX = cx + 6 - (lx + 120);
        const groundY = getGroundHeightAt(u, worldX - cx);
        const waterDepth = Math.max(0, -groundY);
        pos.setXYZ(i, worldX, 0.0, worldZ);
        shoreDistAttr[i] = waterDepth;
      }
      geo.setAttribute('aDepth', new THREE.BufferAttribute(shoreDistAttr, 1));
      geo.computeVertexNormals();

      const mat = new THREE.ShaderMaterial({
        transparent: true,
        uniforms: {
          uTime: { value: 0 },
          uSunDir: { value: new THREE.Vector3(-0.62, 0.45, -0.64).normalize() },
          uSunColor: { value: new THREE.Color('#fff1d0') },
          uSkyHorizon: { value: new THREE.Color('#cbe7f5') },
          uSkyZenith: { value: new THREE.Color('#2f78be') },
          uFogColor: { value: new THREE.Color('#c7e1ee') },
          uFogDensity: { value: 0.0022 },
        },
        vertexShader: `
          attribute float aDepth;
          uniform float uTime;
          varying vec3 vWorldPos;
          varying float vDepth;
          varying float vWaveCrest;

          void main() {
            vDepth = aDepth;
            vec3 p = position;
            float shoreAmp = clamp(aDepth * 0.7, 0.08, 1.0);
            float w1 = sin(p.x * 0.38 + p.z * 0.11 + uTime * 1.85) * 0.13 * shoreAmp;
            float w2 = sin(p.x * 0.19 - p.z * 0.27 + uTime * 1.35) * 0.09 * shoreAmp;
            float w3 = cos(p.x * 0.85 + p.z * 0.48 - uTime * 2.55) * 0.035 * shoreAmp;
            p.y += w1 + w2 + w3;
            vWaveCrest = (w1 + w2) * 3.5;

            vec4 wp = modelMatrix * vec4(p, 1.0);
            vWorldPos = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          uniform float uTime;
          uniform vec3 uSunDir;
          uniform vec3 uSunColor;
          uniform vec3 uSkyHorizon;
          uniform vec3 uSkyZenith;
          uniform vec3 uFogColor;
          uniform float uFogDensity;

          varying vec3 vWorldPos;
          varying float vDepth;
          varying float vWaveCrest;

          float hash(vec2 p) {
            return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
          }

          float noise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(
              mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
              mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
              u.y
            );
          }

          vec3 getWaterNormal(vec2 p, float t) {
            float e = 0.09;
            float h0 =
              noise(p * 0.55 + vec2(t * 0.42, t * 0.18)) * 0.52 +
              noise(p * 1.45 - vec2(t * 0.58, -t * 0.31)) * 0.28 +
              noise(p * 3.40 + vec2(t * 0.85, -t * 0.65)) * 0.13;
            float hx =
              noise((p + vec2(e, 0.0)) * 0.55 + vec2(t * 0.42, t * 0.18)) * 0.52 +
              noise((p + vec2(e, 0.0)) * 1.45 - vec2(t * 0.58, -t * 0.31)) * 0.28 +
              noise((p + vec2(e, 0.0)) * 3.40 + vec2(t * 0.85, -t * 0.65)) * 0.13;
            float hz =
              noise((p + vec2(0.0, e)) * 0.55 + vec2(t * 0.42, t * 0.18)) * 0.52 +
              noise((p + vec2(0.0, e)) * 1.45 - vec2(t * 0.58, -t * 0.31)) * 0.28 +
              noise((p + vec2(0.0, e)) * 3.40 + vec2(t * 0.85, -t * 0.65)) * 0.13;
            return normalize(vec3((h0 - hx) * 1.35, 1.0, (h0 - hz) * 1.35));
          }

          void main() {
            vec3 V = normalize(cameraPosition - vWorldPos);
            vec3 N = getWaterNormal(vWorldPos.xz, uTime);
            vec3 L = normalize(uSunDir);

            // Depth-based realistic coastal water absorption
            vec3 shallowCol = vec3(0.11, 0.54, 0.57);
            vec3 midCol = vec3(0.04, 0.31, 0.46);
            vec3 deepCol = vec3(0.02, 0.14, 0.29);
            float d1 = smoothstep(0.0, 1.25, vDepth);
            float d2 = smoothstep(0.9, 3.6, vDepth);
            vec3 waterBody = mix(shallowCol, midCol, d1);
            waterBody = mix(waterBody, deepCol, d2);

            // Subsurface turquoise glow through wave crests
            float sss = pow(max(dot(V, -L + N * 0.35), 0.0), 3.0) * (0.28 + max(vWaveCrest, 0.0) * 0.5);
            waterBody += vec3(0.06, 0.36, 0.38) * sss;

            // Physical Schlick Fresnel sky reflection
            float cosTheta = max(dot(N, V), 0.0);
            float fresnel = 0.02 + 0.98 * pow(1.0 - cosTheta, 5.0);
            vec3 R = reflect(-V, N);
            vec3 skyRefl = mix(uSkyHorizon, uSkyZenith, pow(clamp(R.y, 0.0, 1.0), 0.65));

            // Sparkling sunlight glints on wave facets
            vec3 H = normalize(L + V);
            float specTight = pow(max(dot(N, H), 0.0), 260.0) * 3.4;
            float specBroad = pow(max(dot(N, H), 0.0), 36.0) * 0.42;
            vec3 spec = uSunColor * (specTight + specBroad);

            vec3 col = mix(waterBody, skyRefl, clamp(fresnel * 0.92, 0.06, 0.94)) + spec;

            // Animated rolling white shoreline surf foam
            float foamNoise = noise(vWorldPos.xz * 1.85 + vec2(uTime * 0.5, uTime * 0.2));
            float surfWave = sin(vDepth * 7.5 - uTime * 2.4 + foamNoise * 2.5) * 0.5 + 0.5;
            float shoreFoam = smoothstep(0.46, 0.04, vDepth) * smoothstep(0.32, 0.72, foamNoise + 0.25);
            float waveBand = smoothstep(0.85, 0.18, vDepth) * smoothstep(0.76, 0.95, surfWave) * smoothstep(0.35, 0.72, foamNoise);
            float foam = clamp(shoreFoam + waveBand * 0.85, 0.0, 0.95);
            vec3 foamCol = mix(vec3(0.92, 0.96, 0.98), uSunColor * 1.02, 0.28);
            col = mix(col, foamCol, foam);

            // Exponential atmospheric distance fog matching scene FogExp2
            float dist = length(cameraPosition - vWorldPos);
            float fogFactor = 1.0 - exp(-pow(dist * uFogDensity, 2.0));
            col = mix(col, uFogColor, clamp(fogFactor, 0.0, 1.0));

            // Smooth alpha feather right at wet sand contact edge
            float alpha = smoothstep(0.0, 0.14, vDepth + foam * 0.15);
            gl_FragColor = vec4(col, clamp(alpha * 0.96, 0.0, 1.0));
          }
        `,
      });

      const ocean = new THREE.Mesh(geo, mat);
      ocean.receiveShadow = false;
      return ocean;
    }

    // =========================================================================
    // 4. REALISTIC 3D CRUISER BICYCLE & ANATOMICAL ARTICULATED PELICAN
    // =========================================================================
    function createTubeBetween(pA, pB, rA, rB, material, radialSegs = 12) {
      const dir = new THREE.Vector3().subVectors(pB, pA);
      const len = dir.length();
      const geo = new THREE.CylinderGeometry(rB, rA, len, radialSegs, 1);
      const mesh = new THREE.Mesh(geo, material);
      mesh.position.copy(pA).addScaledVector(dir, 0.5);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function createSpokedWheel(radius, tireMat, rimMat, spokeMat, hubMat) {
      const group = new THREE.Group();
      const tireTubeR = 0.032;

      // Rubber tire
      const tireGeo = new THREE.TorusGeometry(radius - tireTubeR, tireTubeR, 18, 48);
      tireGeo.rotateY(Math.PI / 2);
      const tire = new THREE.Mesh(tireGeo, tireMat);
      tire.castShadow = true;
      tire.receiveShadow = true;
      group.add(tire);

      // Aluminum rim
      const rimGeo = new THREE.TorusGeometry(radius - tireTubeR * 1.85, 0.013, 12, 48);
      rimGeo.rotateY(Math.PI / 2);
      const rim = new THREE.Mesh(rimGeo, rimMat);
      rim.castShadow = true;
      group.add(rim);

      // Hub
      const hubGeo = new THREE.CylinderGeometry(0.022, 0.022, 0.095, 16);
      hubGeo.rotateZ(Math.PI / 2);
      const hub = new THREE.Mesh(hubGeo, hubMat);
      hub.castShadow = true;
      group.add(hub);

      // 24 crisscrossed steel spokes
      const spokeCount = 24;
      const innerR = 0.020;
      const outerR = radius - tireTubeR * 1.9;
      const spokeGeo = new THREE.CylinderGeometry(0.0022, 0.0022, outerR - innerR, 5);
      const spokes = new THREE.InstancedMesh(spokeGeo, spokeMat, spokeCount);
      const dummy = new THREE.Object3D();
      for (let i = 0; i < spokeCount; i++) {
        const ang = (i / spokeCount) * Math.PI * 2;
        const side = i % 2 === 0 ? 0.026 : -0.026;
        const pHub = new THREE.Vector3(side, Math.sin(ang) * innerR, Math.cos(ang) * innerR);
        const pRim = new THREE.Vector3(0, Math.sin(ang + 0.14 * (i % 2 ? 1 : -1)) * outerR, Math.cos(ang + 0.14 * (i % 2 ? 1 : -1)) * outerR);
        const d = pRim.clone().sub(pHub);
        dummy.position.copy(pHub).addScaledVector(d, 0.5);
        dummy.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize());
        dummy.scale.set(1, d.length() / (outerR - innerR), 1);
        dummy.updateMatrix();
        spokes.setMatrixAt(i, dummy.matrix);
      }
      group.add(spokes);

      return group;
    }

          const c = (i + 1) * (radialSegs + 1) + (j + 1);

        wing.upper.add(shoulderCap);

        // Sculpted smooth upper wing body (coverts)
        const upperMesh = new THREE.Mesh(new THREE.SphereGeometry(0.082, 18, 14), plumageMat);
        upperMesh.scale.set(0.72, 0.86, 1.85);
        upperMesh.position.set(0, 0, 0.13);
        upperMesh.castShadow = true;
        wing.upper.add(upperMesh);

        // Smooth elbow joint sphere
        const elbowCap = new THREE.Mesh(new THREE.SphereGeometry(0.058, 14, 12), plumageMat);
        elbowCap.scale.set(0.82, 0.88, 1.05);
        elbowCap.position.set(0, 0, wing.upperLen);
        wing.upper.add(elbowCap);

        // Soft layered trailing covert feathers hugging the wing curve
        for (let i = 0; i < 4; i++) {
          const cov = new THREE.Mesh(new THREE.SphereGeometry(0.048 - i * 0.004, 12, 10), i >= 2 ? darkFeatherMat : warmPlumageMat);
          cov.scale.set(0.32, 0.72, 2.25);
          cov.position.set(side * 0.024, -0.032 - i * 0.008, 0.08 + i * 0.042);
          cov.rotation.set(-0.22, side * 0.08, 0);
          cov.castShadow = true;
          wing.upper.add(cov);
        }

        // Tapered smooth feathered forearm reaching forward to handlebar grip
        const foreMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.058, wing.foreLen, 14), plumageMat);
        foreMesh.rotation.x = Math.PI / 2;
        foreMesh.scale.set(0.78, 1.0, 1.0);
        foreMesh.position.set(0, 0, wing.foreLen * 0.5);
        foreMesh.castShadow = true;
        wing.forearm.add(foreMesh);

        // Sleek swept-back dark charcoal primary flight feathers hugging the forearm smoothly
        for (let i = 0; i < 5; i++) {
          const pri = new THREE.Mesh(new THREE.SphereGeometry(0.034 - i * 0.003, 12, 10), darkFeatherMat);
          pri.scale.set(0.26, 0.58, 2.45);
          pri.position.set(side * 0.024, -0.028 - i * 0.006, 0.07 + i * 0.035);
          pri.rotation.set(-0.18, side * 0.10, side * 0.05);
          pri.castShadow = true;
          wing.forearm.add(pri);
        }

        // Outer feathered wingtip wrapping naturally around the leather handlebar grip
        const gripTip = new THREE.Mesh(new THREE.SphereGeometry(0.040, 14, 12), darkFeatherMat);
        gripTip.scale.set(0.92, 0.75, 1.22);
        gripTip.position.set(0, 0, wing.foreLen);
        gripTip.castShadow = true;
        wing.forearm.add(gripTip);

        torsoGroup.add(wing.upper);
        torsoGroup.add(wing.forearm);
        return wing;
      }

      const leftWing = buildArticulatedWing(1);
      const rightWing = buildArticulatedWing(-1);

      // --- Articulated Pelican Legs & Orange Webbed Feet (Exact 2-Bone IK to Pedals!) ---
      function buildArticulatedLeg(side) {
        const leg = {
          hip: new THREE.Vector3(side * 0.125, 0.04, -0.01), // in pelicanRoot space (0, 0.90, -0.27)
          thighLen: 0.42,
          shinLen: 0.43,
          thigh: new THREE.Group(),
          shin: new THREE.Group(),
          foot: new THREE.Group(),
        };

        // Feathered upper drumstick thigh tapering cleanly to knee
        const thighMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.072, 0.036, leg.thighLen, 14), plumageMat);
        thighMesh.position.y = -leg.thighLen * 0.5;
        thighMesh.castShadow = true;
        leg.thigh.add(thighMesh);

        // Smooth knee joint cap
        const kneeCap = new THREE.Mesh(new THREE.SphereGeometry(0.034, 12, 10), legMat);
        kneeCap.position.y = -leg.thighLen;
        leg.thigh.add(kneeCap);

        // Tapered orange avian tarsus / lower leg
        const shinMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.019, leg.shinLen, 12), legMat);
        shinMesh.position.y = -leg.shinLen * 0.5;
        shinMesh.castShadow = true;
        leg.shin.add(shinMesh);

        // Ankle joint sitting neatly above pedal
        const ankle = new THREE.Mesh(new THREE.SphereGeometry(0.023, 12, 10), legMat);
        ankle.position.y = 0.016;
        leg.foot.add(ankle);

        // Realistic 3-toed orange webbed pelican foot resting flat ON TOP of the pedal
        const webShape = new THREE.Shape();
        webShape.moveTo(0, -0.035);
        webShape.lineTo(-0.064, 0.105);
        webShape.quadraticCurveTo(-0.030, 0.088, 0, 0.126);
        webShape.quadraticCurveTo(0.030, 0.088, 0.064, 0.105);
        webShape.closePath();
        const webGeo = new THREE.ExtrudeGeometry(webShape, { depth: 0.012, bevelEnabled: true, bevelThickness: 0.004, bevelSize: 0.004, bevelSegments: 2 });
        webGeo.rotateX(Math.PI / 2);
        webGeo.translate(0, 0.015, -0.025); // Bottom of webbed sole sits cleanly at y = 0 (pedal top!)
        const webMesh = new THREE.Mesh(webGeo, legMat);
        webMesh.castShadow = true;
        leg.foot.add(webMesh);

        // Three distinct toes sculpted over the orange webbing
        for (const toeAng of [-0.42, 0, 0.42]) {
          const toe = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.010, 0.125, 8), legMat);
          toe.rotation.x = Math.PI / 2;
          toe.rotation.z = -toeAng;
          toe.position.set(Math.sin(toeAng) * 0.052, 0.014, Math.cos(toeAng) * 0.052 - 0.015);
          leg.foot.add(toe);
        }

        pelicanRoot.add(leg.thigh);
        pelicanRoot.add(leg.shin);
        pelicanRoot.add(leg.foot);
        return leg;
      }

      const leftLeg = buildArticulatedLeg(1);
      const rightLeg = buildArticulatedLeg(-1);

      // Analytical 2-Bone IK Helper (solves hip -> knee -> target in parent space)
      const _ikDir = new THREE.Vector3();
      const _ikAxis = new THREE.Vector3();
      const _ikSide = new THREE.Vector3();
      const _ikKnee = new THREE.Vector3();
      const _down = new THREE.Vector3(0, -1, 0);
      const _fwd = new THREE.Vector3(0, 0, 1);

      function solveTwoBoneIK(origin, target, len1, len2, bendDir, outJoint) {
        _ikDir.subVectors(target, origin);
        const dist = clamp(_ikDir.length(), Math.abs(len1 - len2) + 0.01, len1 + len2 - 0.005);
        _ikDir.normalize();
        const cosA = clamp((len1 * len1 + dist * dist - len2 * len2) / (2 * len1 * dist), -1, 1);
        const sinA = Math.sqrt(Math.max(0, 1 - cosA * cosA));
        _ikSide.crossVectors(_ikDir, bendDir);
        if (_ikSide.lengthSq() < 1e-5) _ikSide.set(1, 0, 0);
        _ikSide.normalize();
        _ikAxis.crossVectors(_ikSide, _ikDir).normalize();
        outJoint.copy(origin)
          .addScaledVector(_ikDir, len1 * cosA)
          .addScaledVector(_ikAxis, len1 * sinA);
        return outJoint;
      }

      const _tmpLeftPedal = new THREE.Vector3();
      const _tmpRightPedal = new THREE.Vector3();
      const _tmpLeftGrip = new THREE.Vector3();
      const _tmpRightGrip = new THREE.Vector3();
      const _tmpV = new THREE.Vector3();
      const _invPelicanMat = new THREE.Matrix4();
      const _invTorsoMat = new THREE.Matrix4();

      // Animation updater called every frame
      function updateRig(wheelAngle, steerAngle, leanAngle, time, goldenFactor, roadBounce) {
        // Spin wheels at true rolling angular velocity
        rearWheel.rotation.x = wheelAngle;
        frontWheel.rotation.x = wheelAngle;

        // Pedal crank cadence (realistic 1.35:1 gear ratio)
        const crankAngle = wheelAngle * 0.72;
        crankGroup.rotation.x = crankAngle;
        leftPedal.rotation.x = -crankAngle;
        rightPedal.rotation.x = -crankAngle;

        // Steering & natural bicycle lean into curves
        steerTurn.rotation.y = steerAngle;
        bikeLeanGroup.rotation.z = leanAngle;
        bikeLeanGroup.position.y = roadBounce;

        // Subtle organic torso cycling sway & breathing
        torsoGroup.position.y = Math.sin(crankAngle * 2.0) * 0.016;
        torsoGroup.rotation.z = Math.sin(crankAngle) * 0.045 - leanAngle * 0.22;
        torsoGroup.rotation.x = Math.cos(crankAngle * 2.0) * 0.025;

        // Tail feather lively bob
        tailGroup.rotation.x = Math.sin(crankAngle * 2.0 - 0.6) * 0.08;

        // Head looks smoothly into turns + curious coastal/city glances
        const lookGlance = Math.sin(time * 0.55) * 0.14 + Math.sin(time * 0.23) * 0.08;
        headGroup.rotation.y = steerAngle * 1.15 + lookGlance;
        headGroup.rotation.x = -0.04 + Math.sin(time * 1.4) * 0.035 + goldenFactor * 0.05; // Gently gazes up toward skyscrapers!
        headGroup.rotation.z = -steerAngle * 0.35;

        // Wind-fluttering crown crest feathers
        crestGroup.rotation.x = Math.sin(time * 14.0) * 0.06;

        // Iconic gular pouch jiggle & gentle breathing expansion
        const pouchBob = Math.sin(crankAngle * 2.0 - 0.8) * 0.08 + Math.sin(time * 3.1) * 0.05;
        pouchGroup.scale.set(1.0 + pouchBob * 0.22, 1.0 + pouchBob * 0.55, 1.0);
        pouchGroup.rotation.x = pouchBob * 0.18;

        // Update world matrices before computing exact IK targets
        bikeLeanGroup.updateMatrixWorld(true);
        _invPelicanMat.copy(pelicanRoot.matrixWorld).invert();
        _invTorsoMat.copy(torsoGroup.matrixWorld).invert();

        // --- Solve 2-Bone IK for Left & Right Webbed Feet on Pedals ---
        leftPedal.getWorldPosition(_tmpLeftPedal).applyMatrix4(_invPelicanMat);
        rightPedal.getWorldPosition(_tmpRightPedal).applyMatrix4(_invPelicanMat);
        _tmpLeftPedal.y += 0.014;
        _tmpRightPedal.y += 0.014;

        for (const [leg, target] of [
          [leftLeg, _tmpLeftPedal],
          [rightLeg, _tmpRightPedal],
        ]) {
          // Knee bends forward (+Z) like a cycling leg
          solveTwoBoneIK(leg.hip, target, leg.thighLen, leg.shinLen, new THREE.Vector3(0, 0, 1), _ikKnee);

          leg.thigh.position.copy(leg.hip);
          _tmpV.subVectors(_ikKnee, leg.hip).normalize();
          leg.thigh.quaternion.setFromUnitVectors(_down, _tmpV);

          leg.shin.position.copy(_ikKnee);
          _tmpV.subVectors(target, _ikKnee).normalize();
          leg.shin.quaternion.setFromUnitVectors(_down, _tmpV);

          leg.foot.position.copy(target);
          leg.foot.rotation.set(0.02, 0, 0);
        }

        // --- Solve 2-Bone IK for Left & Right Wings gripping Handlebars ---
        leftGripAnchor.getWorldPosition(_tmpLeftGrip).applyMatrix4(_invTorsoMat);
        rightGripAnchor.getWorldPosition(_tmpRightGrip).applyMatrix4(_invTorsoMat);

        for (const [wing, target, side] of [
          [leftWing, _tmpLeftGrip, 1],
          [rightWing, _tmpRightGrip, -1],
        ]) {
          // Elbows flare naturally outward & slightly downward
          solveTwoBoneIK(wing.shoulder, target, wing.upperLen, wing.foreLen, new THREE.Vector3(side * 0.85, -0.48, -0.15).normalize(), _ikKnee);

          wing.upper.position.copy(wing.shoulder);
          _tmpV.subVectors(_ikKnee, wing.shoulder).normalize();
          wing.upper.quaternion.setFromUnitVectors(_fwd, _tmpV);

          wing.forearm.position.copy(_ikKnee);
          _tmpV.subVectors(target, _ikKnee).normalize();
          wing.forearm.quaternion.setFromUnitVectors(_fwd, _tmpV);
        }

        // Warm headlamp & taillight glow ramps up as pelican rides into golden hour city
        const lightOn = smoothstep(0.56, 0.82, goldenFactor);
        lampLensMat.emissiveIntensity = 0.15 + lightOn * 2.8;
        taillightMat.emissiveIntensity = 0.25 + lightOn * 2.4;
        headSpot.intensity = lightOn * 14.0;
      }

      return { root, updateRig };
    }

    // =========================================================================
    // 5. SEAMLESS WORLD BUILDER (BEACH -> BOARDWALK -> BOULEVARD -> CITY)
    // =========================================================================
    function buildWorld(scene, maxAniso) {
      const rand = mulberry32(20261119);
      const animatedSeagulls = [];
      const animatedPalms = [];
      const animatedCars = [];
      const cityEmissiveMaterials = [];
      const streetLampMaterials = [];

      // -----------------------------------------------------------------------
      // A. CONTINUOUS SCULPTED TERRAIN RIBBON (Beach Sand -> Park -> Urban Base)
      // -----------------------------------------------------------------------
      const sandTex = createSandTextures(maxAniso);
      const segU = 260;
      const segLat = 48;
      const latMin = -62;
      const latMax = 78;

      const terrainGeo = new THREE.BufferGeometry();
      const tPos = [], tUv = [], tCol = [], tIdx = [];

      const cWetSand = new THREE.Color('#8e7556');
      const cDrySand = new THREE.Color('#e8cfa5');
      const cPathSand = new THREE.Color('#cfb081');
      const cCoastalGrass = new THREE.Color('#6b854e');
      const cUrbanEarth = new THREE.Color('#666a6e');
      const tmpCol = new THREE.Color();

      for (let i = 0; i <= segU; i++) {
        const u = i / segU;
        const cx = pathX(u);
        const cz = pathZ(u);
        const parkBlend = smoothstep(0.45, 0.62, u);
        const cityBlend = smoothstep(0.60, 0.74, u);

        for (let j = 0; j <= segLat; j++) {
          const v = j / segLat;
          // Non-linear lateral distribution for higher density near road & shoreline
          const s = v * 2 - 1;
          const curvedS = Math.sign(s) * Math.pow(Math.abs(s), 1.35);
          const lat = curvedS < 0 ? curvedS * (-latMin) : curvedS * latMax;
          const x = cx + lat;
          const y = getGroundHeightAt(u, lat);

          tPos.push(x, y, cz);
          tUv.push(lat * 0.03, u * 4.5);

          // Organic biome vertex tinting (wet shoreline -> golden dry sand -> coastal grass -> urban)
          const wetMask = 1 - smoothstep(-0.15, 0.42, y);
          tmpCol.copy(cDrySand).lerp(cWetSand, wetMask * 0.92);

          // Packed bike tire path on beach
          const trackMask = (1 - smoothstep(0.6, 2.3, Math.abs(lat))) * (1 - smoothstep(0.24, 0.30, u));
          tmpCol.lerp(cPathSand, trackMask * 0.55);

          // Inland grassy park transition
          const inlandGrass = smoothstep(6.5, 18.0, lat) * parkBlend * (1 - cityBlend * 0.75);
          tmpCol.lerp(cCoastalGrass, inlandGrass * 0.85);

          // Urban base blend
          tmpCol.lerp(cUrbanEarth, cityBlend * smoothstep(2.0, 9.0, Math.abs(lat) + 4.0) * 0.88);

          tCol.push(tmpCol.r, tmpCol.g, tmpCol.b);
        }
      }

      for (let i = 0; i < segU; i++) {
        for (let j = 0; j < segLat; j++) {
          const a = i * (segLat + 1) + j;
          const b = (i + 1) * (segLat + 1) + j;
          const c = (i + 1) * (segLat + 1) + (j + 1);
          const d = i * (segLat + 1) + (j + 1);
          tIdx.push(a, d, b, b, d, c);
        }
      }

      terrainGeo.setAttribute('position', new THREE.Float32BufferAttribute(tPos, 3));
      terrainGeo.setAttribute('uv', new THREE.Float32BufferAttribute(tUv, 2));
      terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(tCol, 3));
      terrainGeo.setIndex(tIdx);
      terrainGeo.computeVertexNormals();

      const terrainMat = new THREE.MeshStandardMaterial({
        map: sandTex.map,
        bumpMap: sandTex.bumpMap,
        bumpScale: 0.08,
        vertexColors: true,
        roughness: 0.90,
        metalness: 0.02,
      });
      const terrainMesh = new THREE.Mesh(terrainGeo, terrainMat);
      terrainMesh.receiveShadow = true;
      scene.add(terrainMesh);

      // Glistening wet shoreline specular ribbon right along the beach surf
      const wetGeo = new THREE.BufferGeometry();
      const wPos = [], wIdx = [];
      const wetSteps = 130;
      for (let i = 0; i <= wetSteps; i++) {
        const u = (i / wetSteps) * 0.54;
        const cx = pathX(u);
        const cz = pathZ(u);
        for (let k = 0; k < 2; k++) {
          const lat = k === 0 ? -11.5 : -3.2;
          const y = getGroundHeightAt(u, lat) + 0.018;
          wPos.push(cx + lat, y, cz);
        }
      }
      for (let i = 0; i < wetSteps; i++) {
        const a = i * 2, b = a + 2, c = a + 3, d = a + 1;
        wIdx.push(a, d, b, b, d, c);
      }
      wetGeo.setAttribute('position', new THREE.Float32BufferAttribute(wPos, 3));
      wetGeo.setIndex(wIdx);
      wetGeo.computeVertexNormals();
      // Feathered horizontal alpha gradient so wet-sand specular blends seamlessly into dry sand
      const wetAlphaCanvas = makeCanvas(128, 8);
      const watx = wetAlphaCanvas.getContext('2d');
      const wag = watx.createLinearGradient(0, 0, 128, 0);
      wag.addColorStop(0.0, 'rgb(0,0,0)');
      wag.addColorStop(0.28, 'rgb(255,255,255)');
      wag.addColorStop(0.72, 'rgb(255,255,255)');
      wag.addColorStop(1.0, 'rgb(0,0,0)');
      watx.fillStyle = wag;
      watx.fillRect(0, 0, 128, 8);
      const wetAlphaTex = new THREE.CanvasTexture(wetAlphaCanvas);

      const wetUv = [];
      for (let i = 0; i <= wetSteps; i++) {
        wetUv.push(0, i / wetSteps, 1, i / wetSteps);
      }
      wetGeo.setAttribute('uv', new THREE.Float32BufferAttribute(wetUv, 2));

      const wetMat = new THREE.MeshPhysicalMaterial({
        color: 0x7c6549,
        roughness: 0.14,
        metalness: 0.05,
        clearcoat: 0.95,
        clearcoatRoughness: 0.12,
        alphaMap: wetAlphaTex,
        transparent: true,
        opacity: 0.56,
        depthWrite: false,
      });
      const wetMesh = new THREE.Mesh(wetGeo, wetMat);
      wetMesh.receiveShadow = true;
      scene.add(wetMesh);

      // -----------------------------------------------------------------------
      // B. HELPER TO BUILD CURVED ROAD / DECK / SIDEWALK RIBBONS
      // -----------------------------------------------------------------------
      function createPathRibbon(uStart, uEnd, steps, halfLeft, halfRight, yOffset, thickness, mat, uvScaleZ = 1) {
        const geo = new THREE.BufferGeometry();
        const pos = [], uv = [], idx = [];
        // 4 vertices per slice: left-bottom, left-top, right-top, right-bottom
        for (let i = 0; i <= steps; i++) {
          const frac = i / steps;
          const u = lerp(uStart, uEnd, frac);
          const f = getPathFrame(u);
          const p = f.position;
          const r = f.right;
          const vCoord = frac * uvScaleZ;

          const pLTop = p.clone().addScaledVector(r, -halfLeft); pLTop.y += yOffset;
          const pRTop = p.clone().addScaledVector(r, halfRight); pRTop.y += yOffset;
          const pLBot = pLTop.clone(); pLBot.y -= thickness;
          const pRBot = pRTop.clone(); pRBot.y -= thickness;

          pos.push(
            pLBot.x, pLBot.y, pLBot.z,
            pLTop.x, pLTop.y, pLTop.z,
            pRTop.x, pRTop.y, pRTop.z,
            pRBot.x, pRBot.y, pRBot.z
          );
          uv.push(
            0, vCoord,
            0, vCoord,
            1, vCoord,
            1, vCoord
          );
        }

        for (let i = 0; i < steps; i++) {
          const base = i * 4;
          const next = (i + 1) * 4;
          // Top face (1 -> 2)
          idx.push(base + 1, base + 2, next + 1, next + 1, base + 2, next + 2);
          // Left fascia (0 -> 1)
          idx.push(base + 0, base + 1, next + 0, next + 0, base + 1, next + 1);
          // Right fascia (2 -> 3)
          idx.push(base + 2, base + 3, next + 2, next + 2, base + 3, next + 3);
        }

        geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
        geo.setIndex(idx);
        geo.computeVertexNormals();
        const mesh = new THREE.Mesh(geo, mat);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        return mesh;
      }

      // -----------------------------------------------------------------------
      // C. CEDAR COASTAL BOARDWALK (u = 0.248 -> 0.515)
      // -----------------------------------------------------------------------
      const bwTex = createBoardwalkTextures(maxAniso);
      const bwMat = new THREE.MeshStandardMaterial({
        map: bwTex.map,
        bumpMap: bwTex.bumpMap,
        bumpScale: 0.035,
        roughnessMap: bwTex.roughnessMap,
        roughness: 0.85,
      });
      const bwDeck = createPathRibbon(0.248, 0.515, 110, 3.0, 3.0, -0.01, 0.24, bwMat, 1.0);
      scene.add(bwDeck);

      // Boardwalk pilings, railings & maritime rope along ocean edge
      const timberMat = new THREE.MeshStandardMaterial({ color: 0x7c5f44, roughness: 0.88 });
      const ropeMat = new THREE.MeshStandardMaterial({ color: 0xc9b48c, roughness: 0.92 });
      const postGeo = new THREE.BoxGeometry(0.14, 1.08, 0.14);
      const pilingGeo = new THREE.CylinderGeometry(0.14, 0.16, 3.2, 8);
      const bwPosts = [];
      const bwPilings = [];
      const ropePtsTop = [];
      const ropePtsMid = [];

      for (let i = 0; i <= 54; i++) {
        const u = lerp(0.258, 0.506, i / 54);
        const f = getPathFrame(u);
        const leftEdge = f.position.clone().addScaledVector(f.right, -2.84);
        const rightEdge = f.position.clone().addScaledVector(f.right, 2.84);

        bwPosts.push({ pos: leftEdge.clone().add(new THREE.Vector3(0, 0.50, 0)), rotY: Math.atan2(f.forward.x, f.forward.z) });
        ropePtsTop.push(leftEdge.clone().add(new THREE.Vector3(0, 0.92, 0)));
        ropePtsMid.push(leftEdge.clone().add(new THREE.Vector3(0, 0.52, 0)));

        if (i % 2 === 0) {
          bwPilings.push(leftEdge.clone().add(new THREE.Vector3(0, -1.6, 0)));
          bwPilings.push(rightEdge.clone().add(new THREE.Vector3(0, -1.6, 0)));
        }
      }

      const postInst = new THREE.InstancedMesh(postGeo, timberMat, bwPosts.length);
      postInst.castShadow = true;
      postInst.receiveShadow = true;
      const dummy = new THREE.Object3D();
      bwPosts.forEach((p, idx) => {
        dummy.position.copy(p.pos);
        dummy.rotation.set(0, p.rotY, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        postInst.setMatrixAt(idx, dummy.matrix);
      });
      scene.add(postInst);

      const pilingInst = new THREE.InstancedMesh(pilingGeo, timberMat, bwPilings.length);
      pilingInst.castShadow = true;
      bwPilings.forEach((p, idx) => {
        dummy.position.copy(p);
        dummy.rotation.set(0, 0, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        pilingInst.setMatrixAt(idx, dummy.matrix);
      });
      scene.add(pilingInst);

      // Continuous thick cedar handrail & maritime rope
      const railTop = new THREE.Mesh(
        new THREE.TubeGeometry(new THREE.CatmullRomCurve3(ropePtsTop), 120, 0.045, 8, false),
        timberMat
      );
      railTop.castShadow = true;
      scene.add(railTop);

      const ropeMid = new THREE.Mesh(
        new THREE.TubeGeometry(new THREE.CatmullRomCurve3(ropePtsMid), 120, 0.024, 6, false),
        ropeMat
      );
      scene.add(ropeMid);

      // Wooden seaside fishing pier jutting cleanly OUT into the turquoise surf at u = 0.36
      {
        const pf = getPathFrame(0.36);
        const pierGroup = new THREE.Group();
        pierGroup.position.copy(pf.position).addScaledVector(pf.right, -3.1);
        pierGroup.lookAt(pierGroup.position.clone().add(pf.forward));
        // With lookAt(forward), local +X points toward the OCEAN (-right)!
        const pierDeck = new THREE.Mesh(new THREE.BoxGeometry(36, 0.24, 5.2), bwMat);
        pierDeck.position.set(18.0, -0.1, 0);
        pierDeck.castShadow = true;

      // -----------------------------------------------------------------------

      // -----------------------------------------------------------------------

      const barkTex = createBarkTexture(maxAniso);
      const palmBarkMat = new THREE.MeshStandardMaterial({
        map: barkTex.map,
