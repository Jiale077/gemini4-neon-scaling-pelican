      // Build reusable curved palm frond geometry
      function createPalmFrondGeometry() {
        const segs = 10;
        const pos = [], norm = [], idx = [];
        const len = 3.2;
        for (let i = 0; i <= segs; i++) {
          const t = i / segs;
          const z = t * len;
          const y = Math.sin(t * Math.PI * 0.78) * 0.55 - t * t * 0.85;
          const halfW = Math.sin(Math.pow(t, 0.75) * Math.PI) * 0.54;
          const droop = 0.14 * Math.sin(t * Math.PI);
          // Left leaflet edge, center rachis, right leaflet edge
          pos.push(-halfW, y - droop, z, 0, y, z, halfW, y - droop, z);
          norm.push(-0.25, 0.95, 0, 0, 1, 0, 0.25, 0.95, 0);
        }
        for (let i = 0; i < segs; i++) {
          const a = i * 3;
          const b = (i + 1) * 3;
          idx.push(a, b, a + 1, a + 1, b, b + 1);
          idx.push(a + 1, b + 1, a + 2, a + 2, b + 1, b + 2);
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        g.setAttribute('normal', new THREE.Float32BufferAttribute(norm, 3));
        g.setIndex(idx);
        g.computeVertexNormals();
        return g;
      }
      const palmFrondGeo = createPalmFrondGeometry();

      function createPalmTree(x, y, z, height, leanX, leanZ) {
        const group = new THREE.Group();
        group.position.set(x, y - 0.2, z);

        const curve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(leanX * 0.35, height * 0.38, leanZ * 0.35),
          new THREE.Vector3(leanX * 0.82, height * 0.74, leanZ * 0.82),
          new THREE.Vector3(leanX, height, leanZ),
        ]);
        const trunk = new THREE.Mesh(new THREE.TubeGeometry(curve, 12, 0.22, 8, false), palmBarkMat);
        trunk.castShadow = true;
        trunk.receiveShadow = true;
        group.add(trunk);

        const crown = new THREE.Group();
        crown.position.set(leanX, height, leanZ);
        group.add(crown);

        // Coconuts cluster
        const cocoMat = new THREE.MeshStandardMaterial({ color: 0x5c3e24, roughness: 0.85 });
        for (let c = 0; c < 3; c++) {
          const ang = (c / 3) * Math.PI * 2;
          const coco = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 8), cocoMat);
          coco.position.set(Math.cos(ang) * 0.22, -0.18, Math.sin(ang) * 0.22);
          crown.add(coco);

        const frondCount = 9;
        for (let i = 0; i < frondCount; i++) {
          const ang = (i / frondCount) * Math.PI * 2 + rand() * 0.35;
          const frond = new THREE.Mesh(palmFrondGeo, i % 2 === 0 ? frondMat : frondTipMat);

          const sc = 0.82 + rand() * 0.35;
          frond.scale.set(sc, sc, sc);
          frond.castShadow = true;
          crown.add(frond);
        }

        scene.add(group);
        animatedPalms.push({ crown, phase: rand() * Math.PI * 2 });
      }

      // -----------------------------------------------------------------------
      // F. BEACH PROPS: ORGANIC SEA-OATS TUFT GRASS, UMBRELLAS, LIFEGUARD TOWER, SEASIDE CAFÉS
      // -----------------------------------------------------------------------
      // Multi-blade arching sea-oats dune grass cluster geometry
      function createGrassTuftGeo() {
        const pos = [], norm = [], idx = [];
        let vBase = 0;
        const blades = 7;
        for (let b = 0; b < blades; b++) {
          const ang = (b / blades) * Math.PI * 2 + (b % 2) * 0.3;
          const ca = Math.cos(ang), sa = Math.sin(ang);
          const px = -sa, pz = ca;
          const h = 0.55 + (b % 3) * 0.16;
          const bend = 0.28 + (b % 2) * 0.15;
          const segs = 4;
          for (let s = 0; s <= segs; s++) {
            const t = s / segs;
            const w = 0.032 * (1 - t * 0.85);
            const r = t * t * bend;
            const y = t * h;
            const cx = ca * r, cz = sa * r;
            pos.push(cx - px * w, y, cz - pz * w, cx + px * w, y, cz + pz * w);
            norm.push(ca * 0.3, 0.95, sa * 0.3, ca * 0.3, 0.95, sa * 0.3);
          }
          for (let s = 0; s < segs; s++) {
            const a = vBase + s * 2;
            idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
          }
          vBase += (segs + 1) * 2;
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        g.setAttribute('normal', new THREE.Float32BufferAttribute(norm, 3));
        g.setIndex(idx);
        g.computeVertexNormals();
        return g;
      }

      const tuftGeo = createGrassTuftGeo();
      const grassMat = new THREE.MeshStandardMaterial({ color: 0x879652, roughness: 0.88, side: THREE.DoubleSide });
      const grassCount = 340;
      const grassInst = new THREE.InstancedMesh(tuftGeo, grassMat, grassCount);
      for (let i = 0; i < grassCount; i++) {
        const u = rand() * 0.46;

      // Beach umbrellas & wooden loungers on golden beach

      // Iconic Whitewashed Coastal Lifeguard Tower at u = 0.15
      {

      // Charming Boardwalk Seaside Cafés & Surf Shacks (facing directly ONTO the boardwalk!)
      const stuccoColors = [0xf2e7d5, 0xebd9c3, 0xe2ebea, 0xf5e0d4];

      for (let i = 0; i < 7; i++) {

        // Sloped coastal awning facing boardwalk (+X side)
        const awning = new THREE.Mesh(
          new THREE.BoxGeometry(2.1, 0.12, w * 0.90),

        );
        awning.position.set(d * 0.5 + 0.95, 3.18, 0);
        awning.rotation.z = -0.26;

        // Terracotta roof overhang + warm wooden fascia trim
        const roof = new THREE.Mesh(

        const board = new THREE.Mesh(

        board.position.set(d * 0.5 + 0.52, 1.02, w * 0.38);
        board.rotation.z = 0.18;
        bwShop.add(board);

        scene.add(bwShop);
      }

      // -----------------------------------------------------------------------
      // G. URBAN ARCHITECTURE: BOULEVARD MID-RISES & DOWNTOWN SKYSCRAPER CANYON
      // -----------------------------------------------------------------------
      const facadeGlass1 = createBuildingFacade('glass', maxAniso, 101);
      const facadeGlass2 = createBuildingFacade('glass', maxAniso, 202);
      const facadeLimestone = createBuildingFacade('limestone', maxAniso, 303);

      const buildingMats = [
        new THREE.MeshStandardMaterial({
          map: facadeGlass1.map, roughnessMap: facadeGlass1.roughnessMap, bumpMap: facadeGlass1.bumpMap, bumpScale: 0.05,
          emissive: 0xffffff, emissiveMap: facadeGlass1.emissiveMap, emissiveIntensity: 0.18,

          emissive: 0xffffff, emissiveMap: facadeBrick.emissiveMap, emissiveIntensity: 0.20,
          metalness: 0.05, roughness: 0.82,
        }),
      ];
      buildingMats.forEach((m) => cityEmissiveMaterials.push(m));

      const roofCapMat = new THREE.MeshStandardMaterial({ color: 0x454b52, roughness: 0.82, metalness: 0.15 });
      const spireMetalMat = new THREE.MeshStandardMaterial({ color: 0xdce4ec, roughness: 0.22, metalness: 0.92 });
      const storefrontTex = createStorefrontTextures(maxAniso);
      const storefrontMat = new THREE.MeshStandardMaterial({
        map: storefrontTex.map,
        roughnessMap: storefrontTex.roughnessMap,
        emissive: 0xffffff,
        emissiveMap: storefrontTex.emissiveMap,
        emissiveIntensity: 0.24,
        roughness: 0.42,
        metalness: 0.28,
      });
      cityEmissiveMaterials.push(storefrontMat);

      function addUrbanBuilding(pos, yaw, width, depth, height, matIdx, addSpire = false) {
        const g = new THREE.Group();
        g.position.copy(pos);
        g.rotation.y = yaw;

        // Ground-floor architectural retail storefront plinth (starts at y = 0..4.0m, upper tower starts cleanly at y = 4.0m with zero z-fighting!)
        const plinthH = 4.0;
        const sfGeo = new THREE.BoxGeometry(depth + 0.12, plinthH, width);
        const sfUv = sfGeo.attributes.uv;
        const sfRep = Math.max(1, Math.round(width / 10));
        for (let i = 0; i < sfUv.count; i++) {
          sfUv.setXY(i, sfUv.getX(i) * sfRep, sfUv.getY(i));
        }
        const sf = new THREE.Mesh(sfGeo, storefrontMat);
        sf.position.y = plinthH * 0.5;
        sf.castShadow = true;
        sf.receiveShadow = true;
        g.add(sf);

        // Stone cornice ledge separating storefront from upper floors
        const ledge = new THREE.Mesh(new THREE.BoxGeometry(depth + 0.45, 0.28, width + 0.3), roofCapMat);
        ledge.position.y = plinthH + 0.12;
        g.add(ledge);

        // Upper building tower starting cleanly above plinth
        const upperH = Math.max(6, height - plinthH);
        const bGeo = new THREE.BoxGeometry(depth, upperH, width);
        const uvAttr = bGeo.attributes.uv;
        const repZ = Math.max(1, Math.round(width / 10));
        const repY = Math.max(1, Math.round(upperH / 14));
        for (let i = 0; i < uvAttr.count; i++) {
          uvAttr.setXY(i, uvAttr.getX(i) * repZ, uvAttr.getY(i) * repY);
        }
        const bMesh = new THREE.Mesh(bGeo, buildingMats[matIdx]);
        bMesh.position.y = plinthH + upperH * 0.5;
        bMesh.castShadow = true;
        bMesh.receiveShadow = true;
        g.add(bMesh);

        // Architectural setback crown / parapet
        const crown = new THREE.Mesh(new THREE.BoxGeometry(depth + 0.5, 0.75, width + 0.5), roofCapMat);
        crown.position.y = height + 0.35;
        g.add(crown);

        if (height > 28) {
          const pent = new THREE.Mesh(new THREE.BoxGeometry(depth * 0.62, 4.5, width * 0.62), buildingMats[matIdx]);
          pent.position.y = height + 2.25;
          pent.castShadow = true;
          g.add(pent);
          if (addSpire) {
            const spire = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.35, 14, 8), spireMetalMat);
            spire.position.y = height + 11.2;
            g.add(spire);
          }
        }

        scene.add(g);
      }

      // Right side urban corridor (starts gently mid-rise at u = 0.53, rises into skyscrapers by u = 0.75..1.05!)
      for (let i = 0; i < 24; i++) {
        const u = lerp(0.53, 1.03, i / 23);
        const uc = clamp(u, 0, 1);
        const f = getPathFrame(uc);
        const extraZ = u > 1 ? -(u - 1) * TOTAL_LENGTH : 0;
        const yaw = Math.atan2(f.forward.x, f.forward.z);
        const depth = 13 + rand() * 8;
        const width = 12 + rand() * 7;
        const lat = 10.0 + depth * 0.5 + rand() * 1.2;
        const pos = f.position.clone().addScaledVector(f.right, lat);
        pos.z += extraZ;
        pos.y = pathY(uc) + 0.14;

        const cityIntensity = smoothstep(0.54, 0.84, u);
        const h = lerp(12, 58, cityIntensity) * (0.74 + rand() * 0.62);
        const matIdx = u < 0.68 ? (rand() > 0.45 ? 2 : 3) : Math.floor(rand() * 4);
        addUrbanBuilding(pos, yaw, width, depth, h, matIdx, h > 42 && rand() > 0.5);
      }

      // Left side urban corridor (opens up after coastal waterfront at u = 0.66 -> 1.03)
      for (let i = 0; i < 18; i++) {
        const u = lerp(0.66, 1.03, i / 17);
        const uc = clamp(u, 0, 1);
        const f = getPathFrame(uc);
        const extraZ = u > 1 ? -(u - 1) * TOTAL_LENGTH : 0;
        const yaw = Math.atan2(f.forward.x, f.forward.z);
        const depth = 14 + rand() * 8;
        const width = 12 + rand() * 7;
        const lat = -(13.2 + depth * 0.5 + rand() * 1.4);
        const pos = f.position.clone().addScaledVector(f.right, lat);
        pos.z += extraZ;
        pos.y = pathY(uc) + 0.14;

        const cityIntensity = smoothstep(0.66, 0.88, u);
        const h = lerp(18, 66, cityIntensity) * (0.74 + rand() * 0.66);
        const matIdx = Math.floor(rand() * 4);
        addUrbanBuilding(pos, yaw, width, depth, h, matIdx, h > 44 && rand() > 0.45);
      }

      // Background skyline cluster (visible from the boardwalk all the way into downtown!)
      const skylineBase = getPathFrame(1.0).position;
      for (let i = 0; i < 34; i++) {
        const side = i % 2 === 0 ? 1 : -1;
        const bx = skylineBase.x + side * (24 + rand() * 78) + (rand() - 0.5) * 18;
        const bz = -515 - rand() * 340;
        const w = 14 + rand() * 14;
        const d = 14 + rand() * 14;
        const h = 38 + rand() * 68;
        addUrbanBuilding(new THREE.Vector3(bx, 2.35, bz), 0, w, d, h, i % 4, h > 68);
      }

      // Iconic Brushed-Steel & Glass Urban Gateway Pedestrian Skybridge at u = 0.69 (symmetric piers on BOTH sidewalks!)
      {
        const gf = getPathFrame(0.69);
        const bridge = new THREE.Group();
        bridge.position.copy(gf.position);
        bridge.lookAt(gf.position.clone().add(gf.forward));
        // Local +X = ocean/left sidewalk (+8..+12), local -X = inland/right sidewalk (-5..-9)
        const steelMat = new THREE.MeshStandardMaterial({ color: 0xb6c4d0, metalness: 0.78, roughness: 0.28 });
        const bridgeGlass = new THREE.MeshPhysicalMaterial({ color: 0x9cd4eb, roughness: 0.10, metalness: 0.22, transparent: true, opacity: 0.56 });
        const centerOffset = 1.4; // midpoint between -7.8 (right sidewalk) and +10.6 (left sidewalk)
        const span = 18.8;
        const deck = new THREE.Mesh(new THREE.BoxGeometry(span, 0.52, 3.6), steelMat);
        deck.position.set(centerOffset, 6.4, 0);
        deck.castShadow = true;
        bridge.add(deck);
        const arch = new THREE.Mesh(new THREE.TorusGeometry(span * 0.5, 0.28, 12, 36, Math.PI), steelMat);
        arch.position.set(centerOffset, 6.4, 0);
        arch.castShadow = true;
        bridge.add(arch);
        const glassWall = new THREE.Mesh(new THREE.BoxGeometry(span - 0.6, 2.2, 3.1), bridgeGlass);
        glassWall.position.set(centerOffset, 7.65, 0);
        bridge.add(glassWall);
        for (const px of [-7.8, 10.6]) {
          const pier = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.52, 7.2, 14), concreteMat);
          pier.position.set(px, 3.4, 0);
          pier.castShadow = true;
          bridge.add(pier);
        }
        scene.add(bridge);
      }

      // -----------------------------------------------------------------------
      // H. STREETLAMPS, ORGANIC LEAFY URBAN TREES & SCULPTED CITY TRAFFIC
      // -----------------------------------------------------------------------
      const lampPoleMat = new THREE.MeshStandardMaterial({ color: 0x3b444d, metalness: 0.72, roughness: 0.32 });
      const lampBulbMat = new THREE.MeshStandardMaterial({
        color: 0xfff0cf,
        emissive: 0xffba5c,
        emissiveIntensity: 0.25,
        roughness: 0.2,
      });
      streetLampMaterials.push(lampBulbMat);

      function addStreetLamp(pos, forward, faceOverRoadDir) {
        const g = new THREE.Group();
        g.position.copy(pos);
        g.lookAt(pos.clone().add(forward));
        // With lookAt(forward), local +X points LEFT (over road from right sidewalk), -X points RIGHT (over road from left sidewalk)
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.11, 6.2, 10), lampPoleMat);
        pole.position.y = 3.1;
        pole.castShadow = true;
        g.add(pole);
        const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 1.5, 8), lampPoleMat);
        arm.rotation.z = Math.PI / 2;
        arm.position.set(faceOverRoadDir * 0.72, 6.08, 0);
        g.add(arm);
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.14, 0.28), lampPoleMat);
        head.position.set(faceOverRoadDir * 1.45, 6.08, 0);
        g.add(head);
        const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), lampBulbMat);
        bulb.scale.set(1.2, 0.45, 0.8);
        bulb.position.set(faceOverRoadDir * 1.45, 5.98, 0);
        g.add(bulb);
        scene.add(g);
      }

      for (let i = 0; i < 20; i++) {
        const u = lerp(0.52, 0.99, i / 19);
        const f = getPathFrame(u);
        const pR = f.position.clone().addScaledVector(f.right, 5.1);
        pR.y = pathY(u) + 0.16;
        addStreetLamp(pR, f.forward, 1);

        if (u > 0.62) {
          const pL = f.position.clone().addScaledVector(f.right, -8.1);
          pL.y = pathY(u) + 0.16;
          addStreetLamp(pL, f.forward, -1);
        }
      }

      // Organic leafy urban boulevard trees (textured multi-cluster canopies + stone planter pits + branching limbs)
      const treeTrunkMat = new THREE.MeshStandardMaterial({ color: 0x625041, roughness: 0.92 });
      const planterMat = new THREE.MeshStandardMaterial({ color: 0x8d8880, roughness: 0.88 });
      const folTex1 = createFoliageTexture(maxAniso, 0x4f7c3a);
      const folTex2 = createFoliageTexture(maxAniso, 0x638c42);
      const folTex3 = createFoliageTexture(maxAniso, 0x879942);
      const foliageMats = [
        new THREE.MeshStandardMaterial({ map: folTex1.map, bumpMap: folTex1.bumpMap, bumpScale: 0.08, roughness: 0.78 }),
        new THREE.MeshStandardMaterial({ map: folTex2.map, bumpMap: folTex2.bumpMap, bumpScale: 0.08, roughness: 0.76 }),
        new THREE.MeshStandardMaterial({ map: folTex3.map, bumpMap: folTex3.bumpMap, bumpScale: 0.08, roughness: 0.78 }),
      ];

      for (let i = 0; i < 22; i++) {
        const u = lerp(0.56, 0.98, i / 21);
        const f = getPathFrame(u);
        for (const side of [1, -1]) {
          if (side === -1 && u < 0.67) continue;
          const lat = side === 1 ? 6.9 : -9.9;
          const p = f.position.clone().addScaledVector(f.right, lat);
          p.y = pathY(u) + 0.16;
          const tg = new THREE.Group();
          tg.position.copy(p);

          // Stone tree-pit curb at sidewalk base
          const planter = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.16, 1.5), planterMat);
          planter.position.y = 0.08;
          tg.add(planter);

          const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.20, 3.1, 8), treeTrunkMat);
          trunk.position.y = 1.55;
          trunk.castShadow = true;
          tg.add(trunk);

          // 3 angled secondary branches
          for (let b = 0; b < 3; b++) {
            const ba = (b / 3) * Math.PI * 2 + i;
            const br = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.08, 1.4, 6), treeTrunkMat);
            br.position.set(Math.cos(ba) * 0.42, 3.1, Math.sin(ba) * 0.42);
            br.rotation.set(Math.sin(ba) * 0.55, 0, -Math.cos(ba) * 0.55);
            tg.add(br);
          }

          // Multi-layered irregular textured leaf clusters (natural crown silhouette, never lollipop!)
          const mat = foliageMats[i % foliageMats.length];
          for (let k = 0; k < 11; k++) {
            const ang = (k / 11) * Math.PI * 2 + rand() * 0.5;
            const rad = k < 3 ? rand() * 0.55 : 0.75 + rand() * 0.95;
            const py = k < 3 ? 4.35 + rand() * 0.75 : 3.25 + rand() * 1.15;
            const puff = new THREE.Mesh(new THREE.IcosahedronGeometry(0.68 + rand() * 0.42, 1), mat);
            puff.scale.set(1.15 + rand() * 0.3, 0.72 + rand() * 0.35, 1.1 + rand() * 0.3);
            puff.position.set(Math.cos(ang) * rad, py, Math.sin(ang) * rad);
            puff.rotation.set(rand() * 2, rand() * 2, rand() * 2);
            puff.castShadow = true;
            puff.receiveShadow = true;
            tg.add(puff);
          }
          scene.add(tg);
        }
      }

      // Sculpted Modern Urban Sedans cruising along the adjacent traffic lanes (u = 0.51..1.0)
      const carPalette = [0xdde2e7, 0x3a5268, 0xa83834, 0x4b7485, 0x5c6670, 0xcfa75b];
      const carGlassMat = new THREE.MeshPhysicalMaterial({ color: 0x263848, roughness: 0.08, metalness: 0.45, clearcoat: 1.0, envMapIntensity: 1.6 });
      const carWheelMat = new THREE.MeshStandardMaterial({ color: 0x1c1e22, roughness: 0.82 });
      const carRimMat = new THREE.MeshStandardMaterial({ color: 0xd0d8e0, metalness: 0.88, roughness: 0.22 });
      const bumperMat = new THREE.MeshStandardMaterial({ color: 0x2a2e33, roughness: 0.65 });
      const headLightMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff0c8, emissiveIntensity: 1.9 });
      const tailLightMat = new THREE.MeshStandardMaterial({ color: 0xcc1818, emissive: 0xff2820, emissiveIntensity: 2.1 });

      // Sleek sculpted sedan side silhouette extruded along width
      const carBodyShape = new THREE.Shape();
      carBodyShape.moveTo(-2.15, 0.32);
      carBodyShape.lineTo(2.15, 0.32);
      carBodyShape.lineTo(2.18, 0.64);
      carBodyShape.quadraticCurveTo(2.10, 0.82, 1.38, 0.88); // Sloped hood
      carBodyShape.lineTo(0.76, 1.34);                        // Raked windshield
      carBodyShape.lineTo(-0.78, 1.35);                       // Sleek roofline
      carBodyShape.lineTo(-1.45, 0.90);                       // Fastback rear glass
      carBodyShape.lineTo(-2.12, 0.82);                       // Trunk deck
      carBodyShape.closePath();
      const carBodyGeo = new THREE.ExtrudeGeometry(carBodyShape, { depth: 1.72, bevelEnabled: true, bevelThickness: 0.09, bevelSize: 0.07, bevelSegments: 3 });
      carBodyGeo.translate(0, 0, -0.86);
      carBodyGeo.rotateY(-Math.PI / 2); // Align nose along +Z!

      function createCityCar(colorHex) {
        const g = new THREE.Group();
        const bodyMat = new THREE.MeshPhysicalMaterial({
          color: colorHex,
          metalness: 0.48,
          roughness: 0.22,
          clearcoat: 1.0,
          clearcoatRoughness: 0.08,
          envMapIntensity: 1.35,
        });
        const body = new THREE.Mesh(carBodyGeo, bodyMat);
        body.castShadow = true;
        body.receiveShadow = true;
        g.add(body);

        // Tinted greenhouse wrap-around windows
        const cabinGlass = new THREE.Mesh(new THREE.BoxGeometry(1.56, 0.38, 1.78), carGlassMat);
        cabinGlass.position.set(0, 1.08, -0.08);
        g.add(cabinGlass);

        // Front & rear trim bumpers
        const fBumper = new THREE.Mesh(new THREE.BoxGeometry(1.80, 0.22, 0.16), bumperMat);
        fBumper.position.set(0, 0.38, 2.18);
        g.add(fBumper);
        const rBumper = new THREE.Mesh(new THREE.BoxGeometry(1.80, 0.22, 0.16), bumperMat);
        rBumper.position.set(0, 0.38, -2.18);
        g.add(rBumper);

        // Wheels with brushed alloy rims
        for (const wx of [-0.90, 0.90]) {
          for (const wz of [-1.32, 1.34]) {
            const w = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.24, 16), carWheelMat);
            w.rotation.z = Math.PI / 2;
            w.position.set(wx, 0.34, wz);
            g.add(w);
            const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.21, 0.21, 0.255, 14), carRimMat);
            rim.rotation.z = Math.PI / 2;
            rim.position.set(wx, 0.34, wz);
            g.add(rim);
          }
        }
        // Sleek LED headlights & full-width taillight bar
        for (const lx of [-0.64, 0.64]) {
          const hl = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.10, 0.08), headLightMat);
          hl.position.set(lx, 0.66, 2.19);
          g.add(hl);
          const tl = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.09, 0.08), tailLightMat);
          tl.position.set(lx, 0.70, -2.18);
          g.add(tl);
        }
        return g;
      }

      for (let i = 0; i < 10; i++) {
        const car = createCityCar(carPalette[i % carPalette.length]);
        const oncoming = i % 2 === 0;
        scene.add(car);
        animatedCars.push({
          mesh: car,
          u: lerp(0.52, 0.98, i / 9),
          laneOffset: oncoming ? -5.0 : -2.6,
          speedU: oncoming ? -0.017 - rand() * 0.008 : 0.014 + rand() * 0.006,
          oncoming,
        });
      }

      // -----------------------------------------------------------------------
      // I. FLYING COASTAL SEAGULLS OVER BEACH & BOARDWALK
      // -----------------------------------------------------------------------
      const gullMat = new THREE.MeshStandardMaterial({ color: 0xf7f8fa, roughness: 0.72, side: THREE.DoubleSide });
      for (let i = 0; i < 12; i++) {
        const gg = new THREE.Group();
        const body = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 8), gullMat);
        body.scale.set(0.65, 0.55, 2.2);
        gg.add(body);

        const wingGeo = new THREE.BoxGeometry(0.75, 0.03, 0.22);
        wingGeo.translate(0.37, 0, 0);
        const wL = new THREE.Mesh(wingGeo, gullMat);
        const wR = new THREE.Mesh(wingGeo, gullMat);
        wR.scale.x = -1;
        gg.add(wL, wR);
        scene.add(gg);

        animatedSeagulls.push({
          group: gg,
          wL,
          wR,
          centerX: pathX(rand() * 0.48) - 8 - rand() * 24,
          centerY: 9 + rand() * 14,
          centerZ: -rand() * 380,
          radius: 10 + rand() * 16,
          speed: 0.25 + rand() * 0.3,
          phase: rand() * Math.PI * 2,
        });
      }

      // -----------------------------------------------------------------------
      // J. FLOATING ATMOSPHERIC MOTES (Sea Spray -> Golden Hour Sun Dust)
      // -----------------------------------------------------------------------
      const moteCount = 260;
      const moteGeo = new THREE.BufferGeometry();
      const motePos = new Float32Array(moteCount * 3);
      for (let i = 0; i < moteCount; i++) {
        motePos[i * 3] = (rand() - 0.5) * 34;
        motePos[i * 3 + 1] = 0.6 + rand() * 10;
        motePos[i * 3 + 2] = (rand() - 0.5) * 38;
      }
      moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
      const moteSpriteCanvas = makeCanvas(64, 64);
      const mstx = moteSpriteCanvas.getContext('2d');
      const mg = mstx.createRadialGradient(32, 32, 0, 32, 32, 30);
      mg.addColorStop(0.0, 'rgba(255,255,255,1.0)');
      mg.addColorStop(0.35, 'rgba(255,250,240,0.65)');
      mg.addColorStop(1.0, 'rgba(255,250,240,0.0)');
      mstx.fillStyle = mg;
      mstx.fillRect(0, 0, 64, 64);
      const moteSpriteTex = new THREE.CanvasTexture(moteSpriteCanvas);

      const moteMat = new THREE.PointsMaterial({
        color: 0xfff2dc,
        map: moteSpriteTex,
        size: 0.16,
        transparent: true,
        opacity: 0.42,
        depthWrite: false,
      });
      const motes = new THREE.Points(moteGeo, moteMat);
      scene.add(motes);

      return {
        animatedSeagulls,
        animatedPalms,
        animatedCars,
        cityEmissiveMaterials,
        streetLampMaterials,
        motes,
        moteMat,
      };
    }

    // =========================================================================
    // 6. CONTINUOUS ONE-TAKE CINEMATIC CAMERA CHOREOGRAPHY
    // =========================================================================
    // Keyframes along normalized journey u in [0, 1]
    // side: -left(ocean) / +right(inland), height: above road, ahead: +in front / -behind
    // Every keyframe keeps the Pelican + Bicycle prominently framed while sweeping across the world!
    const CAMERA_KEYS = [
      { u: 0.00, side:  4.2, height: 1.55, ahead:  2.8, lookH: 1.18, lookAhead:  0.2, fov: 44 }, // Inland-side hero establishing shot with sparkling ocean & surf behind pelican!
      { u: 0.12, side:  3.0, height: 1.42, ahead:  3.6, lookH: 1.16, lookAhead:  0.1, fov: 42 }, // Hero 3/4 front tracking over golden beach & turquoise surf!
      { u: 0.24, side: -2.4, height: 1.85, ahead:  2.9, lookH: 1.20, lookAhead:  0.2, fov: 44 }, // Sweeps gracefully across bow to ocean side onto cedar boardwalk
      { u: 0.37, side: -2.6, height: 2.35, ahead: -4.2, lookH: 1.35, lookAhead:  2.4, fov: 47 }, // Seaside boardwalk reveal: pelican + pier + cafés + city skyline ahead!
      { u: 0.50, side:  2.2, height: 1.12, ahead: -3.2, lookH: 1.12, lookAhead:  1.8, fov: 46 }, // Low-angle wheel & webbed-feet chase onto coastal boulevard
      { u: 0.64, side: -2.0, height: 2.05, ahead: -4.4, lookH: 1.38, lookAhead:  2.4, fov: 47 }, // Gliding boulevard approach toward brushed-steel urban gateway skybridge
      { u: 0.77, side:  2.7, height: 1.40, ahead:  3.9, lookH: 1.25, lookAhead:  0.1, fov: 44 }, // Hero front-3/4 orbit beneath rising downtown skyscrapers
      { u: 0.87, side: -1.9, height: 1.95, ahead: -4.6, lookH: 1.48, lookAhead:  2.5, fov: 48 }, // Golden-hour downtown canyon chase with pelican centered proudly!
      { u: 1.00, side: -1.6, height: 3.15, ahead: -6.0, lookH: 1.95, lookAhead:  3.2, fov: 50 }, // Majestic golden-hour cityscape pull-back finale
    ];

    function sampleCameraKey(u) {
      const uc = clamp(u, 0, 1);
      let idx = 0;
      for (let i = 0; i < CAMERA_KEYS.length - 1; i++) {
        if (uc >= CAMERA_KEYS[i].u && uc <= CAMERA_KEYS[i + 1].u) {
          idx = i;
          break;
        }
      }
      const k0 = CAMERA_KEYS[Math.max(0, idx - 1)];
      const k1 = CAMERA_KEYS[idx];
      const k2 = CAMERA_KEYS[Math.min(CAMERA_KEYS.length - 1, idx + 1)];
      const k3 = CAMERA_KEYS[Math.min(CAMERA_KEYS.length - 1, idx + 2)];
      const span = Math.max(1e-5, k2.u - k1.u);
      const t = clamp((uc - k1.u) / span, 0, 1);

      // Smooth Catmull-Rom interpolation for zero jerk / uninterrupted flow
      const catmull = (p0, p1, p2, p3, s) => {
        const s2 = s * s;
        const s3 = s2 * s;
        return 0.5 * (
          (2 * p1) +
          (-p0 + p2) * s +
          (2 * p0 - 5 * p1 + 4 * p2 - p3) * s2 +
          (-p0 + 3 * p1 - 3 * p2 + p3) * s3
        );
      };

      return {
        side: catmull(k0.side, k1.side, k2.side, k3.side, t),
        height: catmull(k0.height, k1.height, k2.height, k3.height, t),
        ahead: catmull(k0.ahead, k1.ahead, k2.ahead, k3.ahead, t),
        lookH: catmull(k0.lookH, k1.lookH, k2.lookH, k3.lookH, t),
        lookAhead: catmull(k0.lookAhead, k1.lookAhead, k2.lookAhead, k3.lookAhead, t),
        fov: catmull(k0.fov, k1.fov, k2.fov, k3.fov, t),
      };
    }

    // =========================================================================
    // 7. MAIN SCENE INITIALIZATION & RENDER LOOP
    // =========================================================================
    function init() {
      const container = document.getElementById('canvas-container');
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: 'high-performance',
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      const maxAniso = Math.min(12, renderer.capabilities.getMaxAnisotropy());

      const scene = new THREE.Scene();
      const fog = new THREE.FogExp2(0xc9e3f0, 0.0021);
      scene.fog = fog;

      const camera = new THREE.PerspectiveCamera(44, window.innerWidth / window.innerHeight, 0.15, 1400);

      // Sky Dome + PMREM Environment Map for realistic metallic, glass & chrome reflections
      const skyDome = createSkyDome();
      scene.add(skyDome);

      const pmremGen = new THREE.PMREMGenerator(renderer);
      pmremGen.compileEquirectangularShader();
      let currentEnvRT = null;

      function bakeEnvironmentFromSky() {
        const envScene = new THREE.Scene();
        const envSky = createSkyDome();
        envSky.material.uniforms.uSunDir.value.copy(skyDome.material.uniforms.uSunDir.value);
        envSky.material.uniforms.uTopColor.value.copy(skyDome.material.uniforms.uTopColor.value);
        envSky.material.uniforms.uHorizonColor.value.copy(skyDome.material.uniforms.uHorizonColor.value);
        envSky.material.uniforms.uGroundColor.value.copy(skyDome.material.uniforms.uGroundColor.value);
        envSky.material.uniforms.uSunColor.value.copy(skyDome.material.uniforms.uSunColor.value);
        envScene.add(envSky);
        const nextRT = pmremGen.fromScene(envScene, 0.02);
        if (currentEnvRT) currentEnvRT.dispose();
        currentEnvRT = nextRT;
        scene.environment = currentEnvRT.texture;
        envSky.geometry.dispose();
        envSky.material.dispose();
      }

      // Lighting Rig (Sun Directional + Hemisphere Bounce + Warm Fill)
      const sunLight = new THREE.DirectionalLight(0xfff4de, 2.75);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.set(2048, 2048);
      sunLight.shadow.camera.near = 2;
      sunLight.shadow.camera.far = 165;
      const sc = 32;
      sunLight.shadow.camera.left = -sc;
      sunLight.shadow.camera.right = sc;
      sunLight.shadow.camera.top = sc;
      sunLight.shadow.camera.bottom = -sc;
      sunLight.shadow.bias = -0.00045;
      sunLight.shadow.normalBias = 0.03;
      scene.add(sunLight);
      scene.add(sunLight.target);

      const hemiLight = new THREE.HemisphereLight(0x9ed4f5, 0xcab08b, 0.95);
      scene.add(hemiLight);

      const rimFill = new THREE.DirectionalLight(0xa3d4f0, 0.42);
      rimFill.position.set(30, 18, 25);
      scene.add(rimFill);

      // Build Ocean, World & Pelican-on-Bicycle
      const ocean = createRealisticOcean();
      scene.add(ocean);

      const world = buildWorld(scene, maxAniso);
      const pelicanRig = createPelicanAndBicycle(maxAniso);
      scene.add(pelicanRig.root);

      // Bake initial coastal sky environment
      bakeEnvironmentFromSky();

      // =====================================================================
      // INTERACTION & HUD STATE
      // =====================================================================
      const isEmbed = new URLSearchParams(window.location.search).get('embed') === '1';
      if (isEmbed) {
        document.body.classList.remove('cinema-bars');
        document.body.classList.add('embed-mode');
      }

      const embedSync = {
        active: !isEmbed,
        externalClock: false,
        u: 0.14,
        wheelAngle: 0,
        time: 0,
        sideViewMix: 1.0,
        allowFreeOrbit: false,
        snapNext: false,
      };

      const state = {
        u: isEmbed ? 0.20 : 0.012,
        playing: true,
        speedMult: isEmbed ? 0.72 : 1.0,
        cinemaMode: true,
        wheelAngle: 0,
        time: 0,
        orbitYaw: -0.62,
        orbitPitch: 0.24,
        orbitDist: 5.2,
        dragging: false,
        lastX: 0,
        lastY: 0,
        lastEnvBakePhase: -1,
      };

      const elSlider = document.getElementById('progress-slider');
      const elZoneName = document.getElementById('zone-name');
      const elTelemetry = document.getElementById('telemetry-text');
      const elBtnPlay = document.getElementById('btn-play');
      const elBtnSpeed = document.getElementById('btn-speed');
      const elBtnCinema = document.getElementById('btn-cinema');
      const elBtnBars = document.getElementById('btn-bars');
      const elBtnHud = document.getElementById('btn-hud');
      const elBtnRestart = document.getElementById('btn-restart');
      const elVeil = document.getElementById('loop-veil');
      const zmEls = [0, 1, 2, 3].map((i) => document.getElementById(`zm-${i}`));

      function syncButtons() {
        elBtnPlay.textContent = state.playing ? '⏸ 暂停' : '▶ 继续骑行';
        elBtnCinema.textContent = state.cinemaMode ? '🎬 连续运镜' : '🧭 自由环绕';
        elBtnCinema.classList.toggle('active', state.cinemaMode);
        elBtnSpeed.textContent = `${state.speedMult.toFixed(1)}× 巡航`;
      }

      elBtnPlay.addEventListener('click', () => {
        state.playing = !state.playing;
        syncButtons();
      });

      const speedSteps = [0.7, 1.0, 1.5];
      let speedIdx = 1;
      elBtnSpeed.addEventListener('click', () => {
        speedIdx = (speedIdx + 1) % speedSteps.length;
        state.speedMult = speedSteps[speedIdx];
        syncButtons();
      });

      elBtnCinema.addEventListener('click', () => {
        state.cinemaMode = !state.cinemaMode;
        syncButtons();
      });

      elBtnBars.addEventListener('click', () => {
        document.body.classList.toggle('cinema-bars');
        elBtnBars.classList.toggle('active', document.body.classList.contains('cinema-bars'));
      });

      elBtnHud.addEventListener('click', () => {
        document.body.classList.toggle('hud-hidden');
      });

      elBtnRestart.addEventListener('click', () => {
        state.u = 0.012;
        state.playing = true;
        syncButtons();
      });

      let scrubbing = false;
      elSlider.addEventListener('pointerdown', () => { scrubbing = true; });
      elSlider.addEventListener('pointerup', () => { scrubbing = false; });
      elSlider.addEventListener('input', () => {
        const nextU = clamp(parseFloat(elSlider.value) / 1000, 0.005, 0.995);
        if (Math.abs(nextU - state.u) > 0.03) {
          camInitialized = false;
        }
        state.u = nextU;
      });

      // Drag to freely inspect the 3D pelican & realistic materials; scroll to zoom
      container.addEventListener('pointerdown', (e) => {
        state.dragging = true;
        state.lastX = e.clientX;
        state.lastY = e.clientY;
        if (state.cinemaMode) {
          // Initialize orbit angles smoothly from current camera offset
          const off = camera.position.clone().sub(pelicanRig.root.position);
          state.orbitDist = clamp(off.length(), 2.4, 14.0);
          state.orbitYaw = Math.atan2(off.x, off.z);
          state.orbitPitch = clamp(Math.asin(clamp(off.y / state.orbitDist, -0.9, 0.9)), 0.06, 1.15);
          state.cinemaMode = false;
          syncButtons();
        }
      });

      window.addEventListener('pointermove', (e) => {
        if (!state.dragging) return;
        const dx = e.clientX - state.lastX;
        const dy = e.clientY - state.lastY;
        state.lastX = e.clientX;
        state.lastY = e.clientY;
        state.orbitYaw -= dx * 0.0065;
        state.orbitPitch = clamp(state.orbitPitch + dy * 0.0055, 0.05, 1.18);
      });

      window.addEventListener('pointerup', () => { state.dragging = false; });

      container.addEventListener('wheel', (e) => {
        if (!state.cinemaMode) {
          state.orbitDist = clamp(state.orbitDist + e.deltaY * 0.004, 2.2, 16.0);
        }
      }, { passive: true });

      window.addEventListener('keydown', (e) => {
        if (isEmbed) return;
        if (e.code === 'Space') {
          e.preventDefault();
          state.playing = !state.playing;
          syncButtons();
        } else if (e.key === 'h' || e.key === 'H') {
          document.body.classList.toggle('hud-hidden');
        } else if (e.key === 'c' || e.key === 'C') {
          state.cinemaMode = !state.cinemaMode;
          syncButtons();
        }
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // =====================================================================
      // ATMOSPHERE INTERPOLATION COLORS (Beach Afternoon -> Urban Golden Hour)
      // =====================================================================
      const colTopBeach = new THREE.Color('#2772bc');
      const colTopCity = new THREE.Color('#1f3b6e');
      const colHorBeach = new THREE.Color('#cde8f6');
      const colHorCity = new THREE.Color('#f2b679');
      const colFogBeach = new THREE.Color('#c8e2ef');
      const colFogCity = new THREE.Color('#e5ba8e');
      const colSunBeach = new THREE.Color('#fff5df');
      const colSunCity = new THREE.Color('#ffb96c');
      const colHemiSkyBeach = new THREE.Color('#9cd3f5');
      const colHemiSkyCity = new THREE.Color('#f0c196');
      const colHemiGndBeach = new THREE.Color('#cbb089');
      const colHemiGndCity = new THREE.Color('#7a6c64');

      // Smooth damped camera trackers
      const camPosSmooth = new THREE.Vector3();
      const camLookSmooth = new THREE.Vector3();
      let camInitialized = false;
      let smoothLean = 0;
      let smoothSteer = 0;

      const clock = new THREE.Clock();

      // Hide loader smoothly after first frame
      requestAnimationFrame(() => {
        setTimeout(() => document.getElementById('loader').classList.add('hidden'), 260);
      });

      // Expose clean sync controller for parent 《涌现之路》 film & Sandbox integration
      window.__WORLD3D__ = {
        ready: false,
        setSync(opts = {}) {
          const wasActive = embedSync.active;
          if (typeof opts.active === 'boolean') embedSync.active = opts.active;
          if (typeof opts.externalClock === 'boolean') embedSync.externalClock = opts.externalClock;
          if (typeof opts.allowFreeOrbit === 'boolean') {
            if (!opts.allowFreeOrbit && embedSync.allowFreeOrbit) {
              state.cinemaMode = true;
            }
            embedSync.allowFreeOrbit = opts.allowFreeOrbit;
          }
          if (typeof opts.sideViewMix === 'number') embedSync.sideViewMix = clamp(opts.sideViewMix, 0, 1);
          if (typeof opts.u === 'number') {
            if (Math.abs(opts.u - embedSync.u) > 0.06 || !wasActive) {
              embedSync.snapNext = true;
            }
            embedSync.u = clamp(opts.u, 0.006, 0.994);
          }
          if (typeof opts.wheelAngle === 'number') embedSync.wheelAngle = opts.wheelAngle;
          if (typeof opts.time === 'number') embedSync.time = opts.time;
          if (typeof opts.playing === 'boolean') state.playing = opts.playing;
          if (opts.snap) embedSync.snapNext = true;
          if (embedSync.active && !wasActive) {
            camera.aspect = window.innerWidth / Math.max(1, window.innerHeight);
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
          }
        },
        resetCinema() {
          state.cinemaMode = true;
          embedSync.snapNext = true;
        },
      };

      // Pre-warm 1 frame so WebGL shaders & PBR materials are compiled before 1T+ arrives!
      renderer.render(scene, camera);
      window.__WORLD3D__.ready = true;

      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);

        // Idle at 0% GPU while 2D stages (1M -> 70B) are playing
        if (isEmbed && !embedSync.active) {
          return;
        }

        if (isEmbed && embedSync.externalClock) {
          state.u = embedSync.u;
          state.wheelAngle = embedSync.wheelAngle;
          state.time = embedSync.time;
          if (embedSync.snapNext) {
            camInitialized = false;
            embedSync.snapNext = false;
          }
        } else {
          state.time += dt;
          const baseMetersPerSec = 9.4 * state.speedMult;
          if (state.playing && !scrubbing) {
            const prevU = state.u;
            state.u += (baseMetersPerSec / TOTAL_LENGTH) * dt;
            if (state.u >= 0.996) {
              state.u = 0.008;
              camInitialized = false;
            }
            const deltaMeters = Math.max(0, (state.u - prevU) * TOTAL_LENGTH);
            state.wheelAngle += deltaMeters / 0.34;
          } else if (scrubbing) {
            state.wheelAngle = (state.u * TOTAL_LENGTH) / 0.34;
          }
        }

        const baseMetersPerSec = 9.4 * state.speedMult;
        // Smooth golden sun-bloom veil right at loop seam (standalone only)
        if (!isEmbed) {
          const loopFadeOut = smoothstep(0.972, 0.995, state.u);
          const loopFadeIn = 1 - smoothstep(0.008, 0.028, state.u);
          elVeil.style.opacity = String(Math.max(loopFadeOut, loopFadeIn).toFixed(3));
        }

        // 2. Position & orient Pelican + Bicycle along continuous path
        const frame = getPathFrame(state.u);
        pelicanRig.root.position.copy(frame.position);

        // Align local +Z with 3D road forward vector
        const lookTarget = frame.position.clone().add(frame.forward);
        pelicanRig.root.lookAt(lookTarget);

        // Natural lean & handlebar counter-steer into curves
        const targetLean = clamp(-frame.curvature * 0.55, -0.22, 0.22);
        const targetSteer = clamp(frame.curvature * 0.55, -0.28, 0.28);
        smoothLean = lerp(smoothLean, targetLean, 1 - Math.exp(-5.0 * dt));
        smoothSteer = lerp(smoothSteer, targetSteer, 1 - Math.exp(-6.5 * dt));

        // Realistic micro surface feel (soft sand -> wooden plank cadence -> smooth asphalt)
        const onPlanks = smoothstep(0.25, 0.28, state.u) * (1 - smoothstep(0.49, 0.52, state.u));
        const onSand = 1 - smoothstep(0.23, 0.27, state.u);
        const roadBounce =
          Math.sin(state.wheelAngle * 4.5) * 0.006 * onPlanks +
          Math.sin(state.wheelAngle * 1.9) * 0.007 * onSand +
          Math.sin(state.wheelAngle * 2.0) * 0.002;

        const goldenFactor = smoothstep(0.22, 0.92, state.u);
        pelicanRig.updateRig(state.wheelAngle, smoothSteer, smoothLean, state.time, goldenFactor, roadBounce);

        // 3. Continuous Lighting, Sky & Golden-Hour Atmosphere Evolution
        const sunElev = lerp(0.56, 0.16, goldenFactor);
        const sunAzim = lerp(-0.82, -0.34, goldenFactor);
        const sunDir = new THREE.Vector3(
          Math.sin(sunAzim) * Math.cos(sunElev),
          Math.sin(sunElev),
          -Math.cos(sunAzim) * Math.cos(sunElev)
        ).normalize();

        skyDome.position.copy(camera.position);
        skyDome.material.uniforms.uSunDir.value.copy(sunDir);
        skyDome.material.uniforms.uTime.value = state.time;
        skyDome.material.uniforms.uTopColor.value.copy(colTopBeach).lerp(colTopCity, goldenFactor);
        skyDome.material.uniforms.uHorizonColor.value.copy(colHorBeach).lerp(colHorCity, goldenFactor);
        skyDome.material.uniforms.uSunColor.value.copy(colSunBeach).lerp(colSunCity, goldenFactor);

        // Re-bake reflections cleanly at 4 key lighting milestones for realistic golden glass reflections
        const envPhase = Math.floor(goldenFactor * 4);
        if (envPhase !== state.lastEnvBakePhase) {
          state.lastEnvBakePhase = envPhase;
          bakeEnvironmentFromSky();
        }

        // Update sun shadow camera following pelican (texel-snapped to prevent shadow jitter)
        sunLight.color.copy(colSunBeach).lerp(colSunCity, goldenFactor);
        sunLight.intensity = lerp(2.8, 3.25, goldenFactor);
        const snapPos = pelicanRig.root.position.clone();
        snapPos.x = Math.round(snapPos.x * 2) / 2;
        snapPos.z = Math.round(snapPos.z * 2) / 2;
        sunLight.target.position.copy(snapPos);
        sunLight.position.copy(snapPos).addScaledVector(sunDir, 68);
        sunLight.target.updateMatrixWorld();

        hemiLight.color.copy(colHemiSkyBeach).lerp(colHemiSkyCity, goldenFactor);
        hemiLight.groundColor.copy(colHemiGndBeach).lerp(colHemiGndCity, goldenFactor);
        hemiLight.intensity = lerp(1.05, 1.18, goldenFactor);
        rimFill.intensity = lerp(0.45, 0.72, goldenFactor);

        fog.color.copy(colFogBeach).lerp(colFogCity, goldenFactor);
        fog.density = lerp(0.0018, 0.0024, goldenFactor);

        // Update ocean uniforms
        ocean.material.uniforms.uTime.value = state.time;
        ocean.material.uniforms.uSunDir.value.copy(sunDir);
        ocean.material.uniforms.uSunColor.value.copy(sunLight.color);
        ocean.material.uniforms.uSkyHorizon.value.copy(skyDome.material.uniforms.uHorizonColor.value);
        ocean.material.uniforms.uSkyZenith.value.copy(skyDome.material.uniforms.uTopColor.value);
        ocean.material.uniforms.uFogColor.value.copy(fog.color);
        ocean.material.uniforms.uFogDensity.value = fog.density;

        // Warm city windows & streetlamps awakening smoothly
        const cityGlow = smoothstep(0.55, 0.90, state.u);
        for (const m of world.cityEmissiveMaterials) {
          m.emissiveIntensity = 0.14 + cityGlow * 1.15;
        }
        for (const m of world.streetLampMaterials) {
          m.emissiveIntensity = 0.2 + cityGlow * 2.8;
        }

        // 4. Living World Animations (Palms, Seagulls, Urban Traffic, Atmospheric Motes)
        for (const p of world.animatedPalms) {
          p.crown.rotation.z = Math.sin(state.time * 1.55 + p.phase) * 0.055;
          p.crown.rotation.x = Math.cos(state.time * 1.2 + p.phase) * 0.035;
        }

        for (const g of world.animatedSeagulls) {
          const ang = state.time * g.speed + g.phase;
          g.group.position.set(
            g.centerX + Math.cos(ang) * g.radius,
            g.centerY + Math.sin(ang * 2.0) * 1.2,
            g.centerZ + Math.sin(ang) * g.radius
          );
          g.group.rotation.y = -ang;
          const flap = Math.sin(state.time * 6.5 + g.phase * 3.0) * 0.42;
          g.wL.rotation.z = flap;
          g.wR.rotation.z = -flap;
        }

        for (const c of world.animatedCars) {
          if (state.playing) {
            c.u += c.speedU * dt * state.speedMult;
            if (c.u > 0.995) c.u = 0.52;
            if (c.u < 0.52) c.u = 0.995;
          }
          const cf = getPathFrame(clamp(c.u, 0.51, 1.0));
          c.mesh.position.copy(cf.position).addScaledVector(cf.right, c.laneOffset);
          c.mesh.position.y = pathY(clamp(c.u, 0.51, 1.0));
          const dir = c.oncoming ? cf.forward.clone().negate() : cf.forward;
          c.mesh.lookAt(c.mesh.position.clone().add(dir));
        }

        // Atmospheric floating motes follow the pelican seamlessly
        world.motes.position.set(
          frame.position.x,
          frame.position.y,
          frame.position.z
        );
        world.motes.rotation.y = state.time * 0.04;
        world.moteMat.color.setHex(goldenFactor > 0.55 ? 0xffddb0 : 0xf4fbff);
        world.moteMat.opacity = lerp(0.24, 0.44, goldenFactor);

        // 5. Continuous Unbroken One-Take Camera Choreography (or Free Orbit Inspection)
        const targetCamPos = new THREE.Vector3();
        const targetCamLook = new THREE.Vector3();
        let targetFov = 45;

        if (state.cinemaMode) {
          const ck = sampleCameraKey(state.u);
          // When embedded in 《涌现之路》, blend seamlessly from pure 2D-matching right-facing side profile
          // calibrated to match the 2D CAD blueprint pelican's vertical scale & screen position,
          // then smoothly unhook into sweeping 3D cinema crane/orbit!
          const sm = isEmbed && !embedSync.allowFreeOrbit ? embedSync.sideViewMix : 0;
          const side = lerp(ck.side, 6.45, sm);
          const height = lerp(ck.height, 1.18, sm);
          const ahead = lerp(ck.ahead, 0.28, sm);
          const lookH = lerp(ck.lookH, 0.78, sm);
          const lookAhead = lerp(ck.lookAhead, 0.48, sm);
          const fovBlend = lerp(ck.fov, 36, sm);

          // Subtle gimbal breathing & cinema handheld drift (zeroed at sm=1 for rock-steady 2D match)
          const driftScale = 1 - sm;
          const driftX = Math.sin(state.time * 0.65) * 0.14 * driftScale;
          const driftY = Math.cos(state.time * 0.85) * 0.08 * driftScale;

          targetCamPos
            .copy(frame.position)
            .addScaledVector(frame.right, side + driftX)
            .addScaledVector(frame.forward, ahead);
          targetCamPos.y += height + driftY;

          // Strictly guard against terrain/boardwalk clipping
          const groundUnderCam = getWorldGroundY(targetCamPos.x, targetCamPos.z);
          if (targetCamPos.y < groundUnderCam + 0.55) {
            targetCamPos.y = groundUnderCam + 0.55;
          }

          targetCamLook
            .copy(frame.position)
            .addScaledVector(frame.forward, lookAhead);
          targetCamLook.y += lookH;
          targetFov = fovBlend;
        } else {
          // Smooth interactive orbit centered on the moving pelican
          const horiz = Math.cos(state.orbitPitch) * state.orbitDist;
          targetCamPos.set(
            frame.position.x + Math.sin(state.orbitYaw) * horiz,
            frame.position.y + 1.15 + Math.sin(state.orbitPitch) * state.orbitDist,
            frame.position.z + Math.cos(state.orbitYaw) * horiz
          );
          const groundUnderCam = getWorldGroundY(targetCamPos.x, targetCamPos.z);
          if (targetCamPos.y < groundUnderCam + 0.45) {
            targetCamPos.y = groundUnderCam + 0.45;
          }
          targetCamLook.set(frame.position.x, frame.position.y + 1.15, frame.position.z);
          targetFov = 44;
        }

        if (!camInitialized) {
          camPosSmooth.copy(targetCamPos);
          camLookSmooth.copy(targetCamLook);
          camera.fov = targetFov;
          camera.updateProjectionMatrix();
          camInitialized = true;
        } else {
          const posAlpha = 1 - Math.exp(-(state.cinemaMode ? 3.2 : 10.0) * dt);
          const lookAlpha = 1 - Math.exp(-(state.cinemaMode ? 4.4 : 12.0) * dt);
          camPosSmooth.lerp(targetCamPos, posAlpha);
          camLookSmooth.lerp(targetCamLook, lookAlpha);
          if (Math.abs(camera.fov - targetFov) > 0.02) {
            camera.fov = lerp(camera.fov, targetFov, 1 - Math.exp(-3.0 * dt));
            camera.updateProjectionMatrix();
          }
        }

        camera.position.copy(camPosSmooth);
        camera.lookAt(camLookSmooth);

        // 6. Update Minimal HUD Telemetry & Biome Indicator
        if (!scrubbing) {
          elSlider.value = String(Math.round(state.u * 1000));
        }
        const meters = Math.round(state.u * TOTAL_LENGTH);
        const kmh = state.playing ? Math.round(baseMetersPerSec * 2.8) : 0;
        elTelemetry.textContent = `${meters} m / ${TOTAL_LENGTH} m · ${kmh} km/h`;

        let zoneIdx = 0;
        let zoneLabel = '黄金沙滩海岸 · Golden Beach';
        if (state.u >= 0.72) {
          zoneIdx = 3;
          zoneLabel = '黄金时刻都市 · Downtown Canyon';
        } else if (state.u >= 0.50) {
          zoneIdx = 2;
          zoneLabel = '滨海景观大道 · Coastal Boulevard';
        } else if (state.u >= 0.25) {
          zoneIdx = 1;
          zoneLabel = '雪松海滨木栈道 · Cedar Boardwalk';
        }
        elZoneName.textContent = zoneLabel;
        zmEls.forEach((el, i) => el.classList.toggle('current', i === zoneIdx));

        renderer.render(scene, camera);
      }

      animate();
    }

    try {
      init();
    } catch (err) {
      const banner = document.getElementById('error-banner');
      banner.style.display = 'block';
      banner.textContent = `3D 场景初始化失败：${err?.message || err}`;
      document.getElementById('loader').classList.add('hidden');
      console.error(err);
    }
  </script>
</body>
</html>
